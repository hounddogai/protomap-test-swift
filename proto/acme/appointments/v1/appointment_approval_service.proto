syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "AppointmentApprovalServiceProto";
option java_package = "com.acme.appointments.v1";

// Routes appointments through approval, with escalation and delegation.
service AppointmentApprovalService {
  // Submits an appointment.
  rpc SubmitAppointment(SubmitAppointmentRequest) returns (SubmitAppointmentResponse);

  // Approves an appointment.
  rpc ApproveAppointment(ApproveAppointmentRequest) returns (ApproveAppointmentResponse);

  // Rejects an appointment.
  rpc RejectAppointment(RejectAppointmentRequest) returns (RejectAppointmentResponse);

  // Escalates an appointment.
  rpc EscalateAppointment(EscalateAppointmentRequest) returns (EscalateAppointmentResponse);

  // Lists appointments a page at a time.
  rpc ListPendingAppointments(ListPendingAppointmentsRequest) returns (ListPendingAppointmentsResponse);

  // Delegates an appointment.
  rpc DelegateAppointmentApproval(DelegateAppointmentApprovalRequest) returns (DelegateAppointmentApprovalResponse);

  // Returns an appointment.
  rpc GetAppointmentApprovalStatus(GetAppointmentApprovalStatusRequest) returns (GetAppointmentApprovalStatusResponse);

  // Comments an appointment.
  rpc CommentAppointmentApproval(CommentAppointmentApprovalRequest) returns (CommentAppointmentApprovalResponse);
}

// The request of `SubmitAppointment`.
message SubmitAppointmentRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string appointment_id = 2;
  Appointment appointment = 3;
  SubmitAppointmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitAppointment`.
message SubmitAppointmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Appointment appointment = 1;
  SubmitAppointmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

