  acme.common.v1.OperationResult result = 3;
}

// The request of `GetProviderRules`.
message GetProviderRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetProviderRules`.
message GetProviderRulesResponse {
  Provider provider = 1;
  acme.common.v1.OperationResult result = 2;
}
