syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ProviderValidationServiceProto";
option java_package = "com.acme.appointments.v1";

// Checks providers against the rules before anything acts on them.
service ProviderValidationService {
  // Validates a provider.
  rpc ValidateProvider(ValidateProviderRequest) returns (ValidateProviderResponse);

  // Previews a provider.
  rpc PreviewProvider(PreviewProviderRequest) returns (PreviewProviderResponse);

  // Explains a provider.
  rpc ExplainProviderDecision(ExplainProviderDecisionRequest) returns (ExplainProviderDecisionResponse);

  // Scores a provider.
  rpc ScoreProvider(ScoreProviderRequest) returns (ScoreProviderResponse);

  // Lints a provider.
  rpc LintProviders(LintProvidersRequest) returns (LintProvidersResponse);

  // Returns a provider.
  rpc GetProviderRules(GetProviderRulesRequest) returns (GetProviderRulesResponse);
}

// The request of `ValidateProvider`.
message ValidateProviderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  Provider provider = 3;
  ValidateProviderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateProvider`.
message ValidateProviderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Provider provider = 1;
  ValidateProviderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PreviewProvider`.
message PreviewProviderRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  Provider provider = 3;
  PreviewProviderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PreviewProvider`.
message PreviewProviderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Provider provider = 1;
  PreviewProviderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExplainProviderDecision`.
message ExplainProviderDecisionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
