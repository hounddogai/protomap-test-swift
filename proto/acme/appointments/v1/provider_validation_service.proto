    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  Provider provider = 3;
  ExplainProviderDecisionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ExplainProviderDecision`.
message ExplainProviderDecisionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
