syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ProviderApprovalServiceProto";
option java_package = "com.acme.appointments.v1";

// Routes providers through approval, with escalation and delegation.
service ProviderApprovalService {
  // Submits a provider.
  rpc SubmitProvider(SubmitProviderRequest) returns (SubmitProviderResponse);

  // Approves a provider.
  rpc ApproveProvider(ApproveProviderRequest) returns (ApproveProviderResponse);

  // Escalates a provider.
  rpc EscalateProvider(EscalateProviderRequest) returns (EscalateProviderResponse);

  // Lists providers a page at a time.
  rpc ListPendingProviders(ListPendingProvidersRequest) returns (ListPendingProvidersResponse);

  // Delegates a provider.
  rpc DelegateProviderApproval(DelegateProviderApprovalRequest) returns (DelegateProviderApprovalResponse);

  // Recalls a provider.
  rpc RecallProvider(RecallProviderRequest) returns (RecallProviderResponse);

  // Returns a provider.
  rpc GetProviderApprovalStatus(GetProviderApprovalStatusRequest) returns (GetProviderApprovalStatusResponse);
}

// The request of `SubmitProvider`.
message SubmitProviderRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  Provider provider = 3;
  SubmitProviderRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitProvider`.
message SubmitProviderResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Provider provider = 1;
  SubmitProviderResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

