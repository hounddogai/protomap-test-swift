syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ClinicSlotCalculationServiceProto";
option java_package = "com.acme.appointments.v1";

// Computes the figures of a clinic slot, such as totals, taxes, and estimates.
service ClinicSlotCalculationService {
  // Calculates a clinic slot.
  rpc CalculateClinicSlot(CalculateClinicSlotRequest) returns (CalculateClinicSlotResponse);

  // Estimates a clinic slot.
  rpc EstimateClinicSlot(EstimateClinicSlotRequest) returns (EstimateClinicSlotResponse);

  // Quotes a clinic slot.
  rpc QuoteClinicSlot(QuoteClinicSlotRequest) returns (QuoteClinicSlotResponse);

  // Recalculates a clinic slot.
  rpc RecalculateClinicSlots(RecalculateClinicSlotsRequest) returns (RecalculateClinicSlotsResponse);

  // Simulates a clinic slot.
  rpc SimulateClinicSlot(SimulateClinicSlotRequest) returns (SimulateClinicSlotResponse);

  // Explains a clinic slot.
  rpc ExplainClinicSlotCalculation(ExplainClinicSlotCalculationRequest) returns (ExplainClinicSlotCalculationResponse);
}

// The request of `CalculateClinicSlot`.
message CalculateClinicSlotRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clinic_slot_id = 2;
  ClinicSlot clinic_slot = 3;
  CalculateClinicSlotRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateClinicSlot`.
message CalculateClinicSlotResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateClinicSlotResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  ClinicSlot clinic_slot = 1;
  CalculateClinicSlotResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

