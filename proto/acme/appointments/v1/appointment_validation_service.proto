syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "AppointmentValidationServiceProto";
option java_package = "com.acme.appointments.v1";

// Checks appointments against the rules before anything acts on them.
service AppointmentValidationService {
  // Validates an appointment.
  rpc ValidateAppointment(ValidateAppointmentRequest) returns (ValidateAppointmentResponse);

  // Previews an appointment.
  rpc PreviewAppointment(PreviewAppointmentRequest) returns (PreviewAppointmentResponse);

  // Checks an appointment.
  rpc CheckAppointmentEligibility(CheckAppointmentEligibilityRequest) returns (CheckAppointmentEligibilityResponse);

  // Normalizes an appointment.
  rpc NormalizeAppointment(NormalizeAppointmentRequest) returns (NormalizeAppointmentResponse);

  // Explains an appointment.
  rpc ExplainAppointmentDecision(ExplainAppointmentDecisionRequest) returns (ExplainAppointmentDecisionResponse);

  // Scores an appointment.
  rpc ScoreAppointment(ScoreAppointmentRequest) returns (ScoreAppointmentResponse);

  // Lints an appointment.
  rpc LintAppointments(LintAppointmentsRequest) returns (LintAppointmentsResponse);

  // Returns an appointment.
  rpc GetAppointmentRules(GetAppointmentRulesRequest) returns (GetAppointmentRulesResponse);
}

// The request of `ValidateAppointment`.
message ValidateAppointmentRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string appointment_id = 2;
  Appointment appointment = 3;
  ValidateAppointmentRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAppointment`.
message ValidateAppointmentResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Appointment appointment = 1;
  ValidateAppointmentResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

