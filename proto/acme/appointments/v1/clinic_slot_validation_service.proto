syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ClinicSlotValidationServiceProto";
option java_package = "com.acme.appointments.v1";

// Checks clinic slots against the rules before anything acts on them.
service ClinicSlotValidationService {
  // Validates a clinic slot.
  rpc ValidateClinicSlot(ValidateClinicSlotRequest) returns (ValidateClinicSlotResponse);

  // Previews a clinic slot.
  rpc PreviewClinicSlot(PreviewClinicSlotRequest) returns (PreviewClinicSlotResponse);

  // Checks a clinic slot.
  rpc CheckClinicSlotEligibility(CheckClinicSlotEligibilityRequest) returns (CheckClinicSlotEligibilityResponse);

  // Normalizes a clinic slot.
  rpc NormalizeClinicSlot(NormalizeClinicSlotRequest) returns (NormalizeClinicSlotResponse);

  // Explains a clinic slot.
  rpc ExplainClinicSlotDecision(ExplainClinicSlotDecisionRequest) returns (ExplainClinicSlotDecisionResponse);

  // Scores a clinic slot.
  rpc ScoreClinicSlot(ScoreClinicSlotRequest) returns (ScoreClinicSlotResponse);

  // Lints a clinic slot.
  rpc LintClinicSlots(LintClinicSlotsRequest) returns (LintClinicSlotsResponse);
}

// The request of `ValidateClinicSlot`.
message ValidateClinicSlotRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string clinic_slot_id = 2;
  ClinicSlot clinic_slot = 3;
  ValidateClinicSlotRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateClinicSlot`.
message ValidateClinicSlotResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClinicSlot clinic_slot = 1;
  ValidateClinicSlotResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

