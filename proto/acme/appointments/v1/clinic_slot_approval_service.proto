syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ClinicSlotApprovalServiceProto";
option java_package = "com.acme.appointments.v1";

// Routes clinic slots through approval, with escalation and delegation.
service ClinicSlotApprovalService {
  // Submits a clinic slot.
  rpc SubmitClinicSlot(SubmitClinicSlotRequest) returns (SubmitClinicSlotResponse);

  // Approves a clinic slot.
  rpc ApproveClinicSlot(ApproveClinicSlotRequest) returns (ApproveClinicSlotResponse);

  // Rejects a clinic slot.
  rpc RejectClinicSlot(RejectClinicSlotRequest) returns (RejectClinicSlotResponse);

  // Escalates a clinic slot.
  rpc EscalateClinicSlot(EscalateClinicSlotRequest) returns (EscalateClinicSlotResponse);

  // Lists clinic slots a page at a time.
  rpc ListPendingClinicSlots(ListPendingClinicSlotsRequest) returns (ListPendingClinicSlotsResponse);

  // Delegates a clinic slot.
  rpc DelegateClinicSlotApproval(DelegateClinicSlotApprovalRequest) returns (DelegateClinicSlotApprovalResponse);

  // Recalls a clinic slot.
  rpc RecallClinicSlot(RecallClinicSlotRequest) returns (RecallClinicSlotResponse);

  // Comments a clinic slot.
  rpc CommentClinicSlotApproval(CommentClinicSlotApprovalRequest) returns (CommentClinicSlotApprovalResponse);
}

// The request of `SubmitClinicSlot`.
message SubmitClinicSlotRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clinic_slot_id = 2;
  ClinicSlot clinic_slot = 3;
  SubmitClinicSlotRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitClinicSlot`.
message SubmitClinicSlotResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClinicSlot clinic_slot = 1;
  SubmitClinicSlotResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

