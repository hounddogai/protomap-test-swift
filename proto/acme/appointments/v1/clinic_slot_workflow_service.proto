import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ClinicSlotWorkflowServiceProto";
option java_package = "com.acme.appointments.v1";

// Runs the long-lived workflow that takes a clinic slot from start to finish.
service ClinicSlotWorkflowService {
  // Starts a clinic slot.
  rpc StartClinicSlotWorkflow(StartClinicSlotWorkflowRequest) returns (StartClinicSlotWorkflowResponse);

  // Advances a clinic slot.
  rpc AdvanceClinicSlotWorkflow(AdvanceClinicSlotWorkflowRequest) returns (AdvanceClinicSlotWorkflowResponse);

  // Retrys a clinic slot.
  rpc RetryClinicSlotWorkflow(RetryClinicSlotWorkflowRequest) returns (RetryClinicSlotWorkflowResponse);

  // Pauses a clinic slot.
  rpc PauseClinicSlotWorkflow(PauseClinicSlotWorkflowRequest) returns (PauseClinicSlotWorkflowResponse);

  // Resumes a clinic slot.
  rpc ResumeClinicSlotWorkflow(ResumeClinicSlotWorkflowRequest) returns (ResumeClinicSlotWorkflowResponse);

  // Returns a clinic slot.
  rpc InspectClinicSlotWorkflow(InspectClinicSlotWorkflowRequest) returns (InspectClinicSlotWorkflowResponse);

  // Lists clinic slots a page at a time.
  rpc ListClinicSlotWorkflows(ListClinicSlotWorkflowsRequest) returns (ListClinicSlotWorkflowsResponse);

  // Signals a clinic slot.
  rpc SignalClinicSlotWorkflow(SignalClinicSlotWorkflowRequest) returns (SignalClinicSlotWorkflowResponse);
}

// The request of `StartClinicSlotWorkflow`.
message StartClinicSlotWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string clinic_slot_id = 2;
  ClinicSlot clinic_slot = 3;
  StartClinicSlotWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartClinicSlotWorkflow`.
message StartClinicSlotWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  ClinicSlot clinic_slot = 1;
  StartClinicSlotWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

