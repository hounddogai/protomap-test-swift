syntax = "proto3";

package acme.appointments.v1;

import "acme/appointments/v1/appointments.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Appointments.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/appointments/v1;appointmentsv1";
option java_multiple_files = true;
option java_outer_classname = "ProviderWorkflowServiceProto";
option java_package = "com.acme.appointments.v1";

// Runs the long-lived workflow that takes a provider from start to finish.
service ProviderWorkflowService {
  // Starts a provider.
  rpc StartProviderWorkflow(StartProviderWorkflowRequest) returns (StartProviderWorkflowResponse);

  // Advances a provider.
  rpc AdvanceProviderWorkflow(AdvanceProviderWorkflowRequest) returns (AdvanceProviderWorkflowResponse);

  // Cancels a provider.
  rpc CancelProviderWorkflow(CancelProviderWorkflowRequest) returns (CancelProviderWorkflowResponse);

  // Retrys a provider.
  rpc RetryProviderWorkflow(RetryProviderWorkflowRequest) returns (RetryProviderWorkflowResponse);

  // Pauses a provider.
  rpc PauseProviderWorkflow(PauseProviderWorkflowRequest) returns (PauseProviderWorkflowResponse);

  // Resumes a provider.
  rpc ResumeProviderWorkflow(ResumeProviderWorkflowRequest) returns (ResumeProviderWorkflowResponse);

  // Returns a provider.
  rpc InspectProviderWorkflow(InspectProviderWorkflowRequest) returns (InspectProviderWorkflowResponse);

  // Lists providers a page at a time.
  rpc ListProviderWorkflows(ListProviderWorkflowsRequest) returns (ListProviderWorkflowsResponse);

  // Signals a provider.
  rpc SignalProviderWorkflow(SignalProviderWorkflowRequest) returns (SignalProviderWorkflowResponse);
}

// The request of `StartProviderWorkflow`.
message StartProviderWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string provider_id = 2;
  Provider provider = 3;
  StartProviderWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartProviderWorkflow`.
message StartProviderWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Provider provider = 1;
  StartProviderWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

