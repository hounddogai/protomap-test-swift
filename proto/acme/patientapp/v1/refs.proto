syntax = "proto3";

package acme.patientapp.v1;

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.patientapp.v1";

// A reference to a patient home of the patientapp domain.
message PatientHomeRef {
  string patient_home_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a care inbox of the patientapp domain.
message CareInboxRef {
  string care_inbox_id = 1;
  string display_name = 2;
  string number = 3;
}
