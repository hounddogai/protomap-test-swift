syntax = "proto3";

package acme.patientapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patientapp/v1/patientapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "CareInboxIntegrationServiceProto";
option java_package = "com.acme.patientapp.v1";

// Connects external systems that send care inbox events.
service CareInboxIntegrationService {
  // Connects a care inbox.
  rpc ConnectCareInboxSource(ConnectCareInboxSourceRequest) returns (ConnectCareInboxSourceResponse);

  // Disconnects a care inbox.
  rpc DisconnectCareInboxSource(DisconnectCareInboxSourceRequest) returns (DisconnectCareInboxSourceResponse);

  // Takes a stream of care inboxes and answers once at the end.
  rpc IngestCareInboxEvents(stream IngestCareInboxEventsRequest) returns (IngestCareInboxEventsResponse);

  // Replays a care inbox.
  rpc ReplayCareInboxEvents(ReplayCareInboxEventsRequest) returns (ReplayCareInboxEventsResponse);

  // Acknowledges a care inbox.
  rpc AcknowledgeCareInboxEvent(AcknowledgeCareInboxEventRequest) returns (AcknowledgeCareInboxEventResponse);

  // Exchanges changes of care inboxes with a peer.
  rpc RelayCareInboxMessages(stream RelayCareInboxMessagesRequest) returns (stream RelayCareInboxMessagesResponse);

  // Lists care inboxes a page at a time.
  rpc ListCareInboxSources(ListCareInboxSourcesRequest) returns (ListCareInboxSourcesResponse);

  // Tests a care inbox.
  rpc TestCareInboxConnection(TestCareInboxConnectionRequest) returns (TestCareInboxConnectionResponse);
}

// The request of `ConnectCareInboxSource`.
message ConnectCareInboxSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  ConnectCareInboxSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ConnectCareInboxSource`.
message ConnectCareInboxSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  ConnectCareInboxSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DisconnectCareInboxSource`.
message DisconnectCareInboxSourceRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  DisconnectCareInboxSourceRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `DisconnectCareInboxSource`.
message DisconnectCareInboxSourceResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  DisconnectCareInboxSourceResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `IngestCareInboxEvents`.
message IngestCareInboxEventsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    IngestCareInboxEventsRequest.StreamHeader header = 2;
    CareInbox record = 3;
  }
  int64 sequence = 4;
}

// The response of `IngestCareInboxEvents`.
message IngestCareInboxEventsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string care_inbox_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated IngestCareInboxEventsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `ReplayCareInboxEvents`.
message ReplayCareInboxEventsRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  ReplayCareInboxEventsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ReplayCareInboxEvents`.
message ReplayCareInboxEventsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  ReplayCareInboxEventsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `AcknowledgeCareInboxEvent`.
message AcknowledgeCareInboxEventRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  AcknowledgeCareInboxEventRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `AcknowledgeCareInboxEvent`.
message AcknowledgeCareInboxEventResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  AcknowledgeCareInboxEventResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RelayCareInboxMessages`.
message RelayCareInboxMessagesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    CareInbox change = 2;
    RelayCareInboxMessagesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `RelayCareInboxMessages`.
message RelayCareInboxMessagesResponse {
  CareInbox care_inbox = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListCareInboxSources`.
message ListCareInboxSourcesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CareInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCareInboxSourcesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCareInboxSources`.
message ListCareInboxSourcesResponse {
  repeated CareInbox care_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `TestCareInboxConnection`.
message TestCareInboxConnectionRequest {
  // What the operation needs besides the record.
  message Details {
    string endpoint = 1;
    google.protobuf.Any envelope = 2;
    string message_id = 3;
    string source_system = 4;
    google.protobuf.Timestamp received_at = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  TestCareInboxConnectionRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `TestCareInboxConnection`.
message TestCareInboxConnectionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  TestCareInboxConnectionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
