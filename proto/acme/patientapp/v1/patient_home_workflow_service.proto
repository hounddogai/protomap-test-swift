option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "PatientHomeWorkflowServiceProto";
option java_package = "com.acme.patientapp.v1";

// Runs the long-lived workflow that takes a patient home from start to finish.
service PatientHomeWorkflowService {
  // Starts a patient home.
  rpc StartPatientHomeWorkflow(StartPatientHomeWorkflowRequest) returns (StartPatientHomeWorkflowResponse);

  // Advances a patient home.
  rpc AdvancePatientHomeWorkflow(AdvancePatientHomeWorkflowRequest) returns (AdvancePatientHomeWorkflowResponse);

  // Cancels a patient home.
  rpc CancelPatientHomeWorkflow(CancelPatientHomeWorkflowRequest) returns (CancelPatientHomeWorkflowResponse);

  // Retrys a patient home.
  rpc RetryPatientHomeWorkflow(RetryPatientHomeWorkflowRequest) returns (RetryPatientHomeWorkflowResponse);

  // Pauses a patient home.
  rpc PausePatientHomeWorkflow(PausePatientHomeWorkflowRequest) returns (PausePatientHomeWorkflowResponse);

  // Resumes a patient home.
  rpc ResumePatientHomeWorkflow(ResumePatientHomeWorkflowRequest) returns (ResumePatientHomeWorkflowResponse);

  // Returns a patient home.
  rpc InspectPatientHomeWorkflow(InspectPatientHomeWorkflowRequest) returns (InspectPatientHomeWorkflowResponse);

  // Lists patient homes a page at a time.
  rpc ListPatientHomeWorkflows(ListPatientHomeWorkflowsRequest) returns (ListPatientHomeWorkflowsResponse);

  // Signals a patient home.
  rpc SignalPatientHomeWorkflow(SignalPatientHomeWorkflowRequest) returns (SignalPatientHomeWorkflowResponse);
}

// The request of `StartPatientHomeWorkflow`.
message StartPatientHomeWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  PatientHome patient_home = 3;
  StartPatientHomeWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartPatientHomeWorkflow`.
message StartPatientHomeWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PatientHome patient_home = 1;
  StartPatientHomeWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

