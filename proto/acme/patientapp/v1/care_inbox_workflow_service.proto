option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "CareInboxWorkflowServiceProto";
option java_package = "com.acme.patientapp.v1";

// Runs the long-lived workflow that takes a care inbox from start to finish.
service CareInboxWorkflowService {
  // Starts a care inbox.
  rpc StartCareInboxWorkflow(StartCareInboxWorkflowRequest) returns (StartCareInboxWorkflowResponse);

  // Advances a care inbox.
  rpc AdvanceCareInboxWorkflow(AdvanceCareInboxWorkflowRequest) returns (AdvanceCareInboxWorkflowResponse);

  // Cancels a care inbox.
  rpc CancelCareInboxWorkflow(CancelCareInboxWorkflowRequest) returns (CancelCareInboxWorkflowResponse);

  // Retrys a care inbox.
  rpc RetryCareInboxWorkflow(RetryCareInboxWorkflowRequest) returns (RetryCareInboxWorkflowResponse);

  // Pauses a care inbox.
  rpc PauseCareInboxWorkflow(PauseCareInboxWorkflowRequest) returns (PauseCareInboxWorkflowResponse);

  // Resumes a care inbox.
  rpc ResumeCareInboxWorkflow(ResumeCareInboxWorkflowRequest) returns (ResumeCareInboxWorkflowResponse);

  // Lists care inboxes a page at a time.
  rpc ListCareInboxWorkflows(ListCareInboxWorkflowsRequest) returns (ListCareInboxWorkflowsResponse);

  // Signals a care inbox.
  rpc SignalCareInboxWorkflow(SignalCareInboxWorkflowRequest) returns (SignalCareInboxWorkflowResponse);
}

// The request of `StartCareInboxWorkflow`.
message StartCareInboxWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  CareInbox care_inbox = 3;
  StartCareInboxWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCareInboxWorkflow`.
message StartCareInboxWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  StartCareInboxWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

