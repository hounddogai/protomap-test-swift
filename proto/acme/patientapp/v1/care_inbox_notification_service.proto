syntax = "proto3";

package acme.patientapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patientapp/v1/patientapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "CareInboxNotificationServiceProto";
option java_package = "com.acme.patientapp.v1";

// Tells the people who follow a care inbox what changed.
service CareInboxNotificationService {
  // Subscribes a care inbox.
  rpc SubscribeCareInboxUpdates(SubscribeCareInboxUpdatesRequest) returns (SubscribeCareInboxUpdatesResponse);

  // Unsubscribes a care inbox.
  rpc UnsubscribeCareInboxUpdates(UnsubscribeCareInboxUpdatesRequest) returns (UnsubscribeCareInboxUpdatesResponse);

  // Notifys a care inbox.
  rpc NotifyCareInboxWatchers(NotifyCareInboxWatchersRequest) returns (NotifyCareInboxWatchersResponse);

  // Lists care inboxes a page at a time.
  rpc ListCareInboxSubscriptions(ListCareInboxSubscriptionsRequest) returns (ListCareInboxSubscriptionsResponse);

  // Sends a care inbox.
  rpc SendCareInboxTestNotice(SendCareInboxTestNoticeRequest) returns (SendCareInboxTestNoticeResponse);

  // Returns a care inbox.
  rpc GetCareInboxPreferences(GetCareInboxPreferencesRequest) returns (GetCareInboxPreferencesResponse);

  // Streams the changes of care inboxes as they happen.
  rpc StreamCareInboxNotices(StreamCareInboxNoticesRequest) returns (stream StreamCareInboxNoticesResponse);
}

// The request of `SubscribeCareInboxUpdates`.
message SubscribeCareInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  SubscribeCareInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribeCareInboxUpdates`.
message SubscribeCareInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  SubscribeCareInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribeCareInboxUpdates`.
message UnsubscribeCareInboxUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  UnsubscribeCareInboxUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribeCareInboxUpdates`.
message UnsubscribeCareInboxUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  UnsubscribeCareInboxUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyCareInboxWatchers`.
message NotifyCareInboxWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  NotifyCareInboxWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyCareInboxWatchers`.
message NotifyCareInboxWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  NotifyCareInboxWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListCareInboxSubscriptions`.
message ListCareInboxSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CareInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListCareInboxSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListCareInboxSubscriptions`.
message ListCareInboxSubscriptionsResponse {
  repeated CareInbox care_inboxes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendCareInboxTestNotice`.
message SendCareInboxTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  SendCareInboxTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendCareInboxTestNotice`.
message SendCareInboxTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareInbox care_inbox = 1;
  SendCareInboxTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetCareInboxPreferences`.
message GetCareInboxPreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string care_inbox_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetCareInboxPreferences`.
message GetCareInboxPreferencesResponse {
  CareInbox care_inbox = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamCareInboxNotices`.
message StreamCareInboxNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated CareInboxStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamCareInboxNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamCareInboxNotices`.
message StreamCareInboxNoticesResponse {
  CareInbox care_inbox = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
