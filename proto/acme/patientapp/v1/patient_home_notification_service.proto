syntax = "proto3";

package acme.patientapp.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patientapp/v1/patientapp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patientapp.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patientapp/v1;patientappv1";
option java_multiple_files = true;
option java_outer_classname = "PatientHomeNotificationServiceProto";
option java_package = "com.acme.patientapp.v1";

// Tells the people who follow a patient home what changed.
service PatientHomeNotificationService {
  // Subscribes a patient home.
  rpc SubscribePatientHomeUpdates(SubscribePatientHomeUpdatesRequest) returns (SubscribePatientHomeUpdatesResponse);

  // Unsubscribes a patient home.
  rpc UnsubscribePatientHomeUpdates(UnsubscribePatientHomeUpdatesRequest) returns (UnsubscribePatientHomeUpdatesResponse);

  // Notifys a patient home.
  rpc NotifyPatientHomeWatchers(NotifyPatientHomeWatchersRequest) returns (NotifyPatientHomeWatchersResponse);

  // Lists patient homes a page at a time.
  rpc ListPatientHomeSubscriptions(ListPatientHomeSubscriptionsRequest) returns (ListPatientHomeSubscriptionsResponse);

  // Sends a patient home.
  rpc SendPatientHomeTestNotice(SendPatientHomeTestNoticeRequest) returns (SendPatientHomeTestNoticeResponse);

  // Returns a patient home.
  rpc GetPatientHomePreferences(GetPatientHomePreferencesRequest) returns (GetPatientHomePreferencesResponse);

  // Streams the changes of patient homes as they happen.
  rpc StreamPatientHomeNotices(StreamPatientHomeNoticesRequest) returns (stream StreamPatientHomeNoticesResponse);
}

// The request of `SubscribePatientHomeUpdates`.
message SubscribePatientHomeUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  SubscribePatientHomeUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SubscribePatientHomeUpdates`.
message SubscribePatientHomeUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PatientHome patient_home = 1;
  SubscribePatientHomeUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `UnsubscribePatientHomeUpdates`.
message UnsubscribePatientHomeUpdatesRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  UnsubscribePatientHomeUpdatesRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `UnsubscribePatientHomeUpdates`.
message UnsubscribePatientHomeUpdatesResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PatientHome patient_home = 1;
  UnsubscribePatientHomeUpdatesResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `NotifyPatientHomeWatchers`.
message NotifyPatientHomeWatchersRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  NotifyPatientHomeWatchersRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `NotifyPatientHomeWatchers`.
message NotifyPatientHomeWatchersResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PatientHome patient_home = 1;
  NotifyPatientHomeWatchersResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPatientHomeSubscriptions`.
message ListPatientHomeSubscriptionsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPatientHomeSubscriptionsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPatientHomeSubscriptions`.
message ListPatientHomeSubscriptionsResponse {
  repeated PatientHome patient_homes = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SendPatientHomeTestNotice`.
message SendPatientHomeTestNoticeRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  SendPatientHomeTestNoticeRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SendPatientHomeTestNotice`.
message SendPatientHomeTestNoticeResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  PatientHome patient_home = 1;
  SendPatientHomeTestNoticeResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPatientHomePreferences`.
message GetPatientHomePreferencesRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_home_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPatientHomePreferences`.
message GetPatientHomePreferencesResponse {
  PatientHome patient_home = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `StreamPatientHomeNotices`.
message StreamPatientHomeNoticesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientHomeStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPatientHomeNoticesRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPatientHomeNotices`.
message StreamPatientHomeNoticesResponse {
  PatientHome patient_home = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}
