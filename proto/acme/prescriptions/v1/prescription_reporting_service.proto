syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "PrescriptionReportingServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Builds and schedules reports about prescriptions.
service PrescriptionReportingService {
  // Generates a prescription.
  rpc GeneratePrescriptionReport(GeneratePrescriptionReportRequest) returns (GeneratePrescriptionReportResponse);

  // Returns a prescription.
  rpc FetchPrescriptionReport(FetchPrescriptionReportRequest) returns (FetchPrescriptionReportResponse);

  // Schedules a prescription.
  rpc SchedulePrescriptionReport(SchedulePrescriptionReportRequest) returns (SchedulePrescriptionReportResponse);

  // Streams the changes of prescriptions as they happen.
  rpc StreamPrescriptionMetrics(StreamPrescriptionMetricsRequest) returns (stream StreamPrescriptionMetricsResponse);

  // Lists prescriptions a page at a time.
  rpc ListPrescriptionReports(ListPrescriptionReportsRequest) returns (ListPrescriptionReportsResponse);

  // Shares a prescription.
  rpc SharePrescriptionReport(SharePrescriptionReportRequest) returns (SharePrescriptionReportResponse);

  // Counts prescriptions by status.
  rpc CountPrescriptionTotals(CountPrescriptionTotalsRequest) returns (CountPrescriptionTotalsResponse);

  // Deletes a prescription.
  rpc DeletePrescriptionReport(DeletePrescriptionReportRequest) returns (DeletePrescriptionReportResponse);
}

// The request of `GeneratePrescriptionReport`.
message GeneratePrescriptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  GeneratePrescriptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePrescriptionReport`.
message GeneratePrescriptionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPrescriptionReport`.
message FetchPrescriptionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPrescriptionReport`.
message FetchPrescriptionReportResponse {
  Prescription prescription = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePrescriptionReport`.
message SchedulePrescriptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  SchedulePrescriptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePrescriptionReport`.
message SchedulePrescriptionReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPrescriptionMetrics`.
message StreamPrescriptionMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPrescriptionMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPrescriptionMetrics`.
message StreamPrescriptionMetricsResponse {
  Prescription prescription = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPrescriptionReports`.
message ListPrescriptionReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPrescriptionReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPrescriptionReports`.
message ListPrescriptionReportsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePrescriptionReport`.
message SharePrescriptionReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  SharePrescriptionReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePrescriptionReport`.
message SharePrescriptionReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  SharePrescriptionReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPrescriptionTotals`.
message CountPrescriptionTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPrescriptionTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPrescriptionTotals`.
message CountPrescriptionTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePrescriptionReport`.
message DeletePrescriptionReportRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePrescriptionReport`.
message DeletePrescriptionReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
