syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "PrescriptionApprovalServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Routes prescriptions through approval, with escalation and delegation.
service PrescriptionApprovalService {
  // Submits a prescription.
  rpc SubmitPrescription(SubmitPrescriptionRequest) returns (SubmitPrescriptionResponse);

  // Approves a prescription.
  rpc ApprovePrescription(ApprovePrescriptionRequest) returns (ApprovePrescriptionResponse);

  // Rejects a prescription.
  rpc RejectPrescription(RejectPrescriptionRequest) returns (RejectPrescriptionResponse);

  // Escalates a prescription.
  rpc EscalatePrescription(EscalatePrescriptionRequest) returns (EscalatePrescriptionResponse);

  // Lists prescriptions a page at a time.
  rpc ListPendingPrescriptions(ListPendingPrescriptionsRequest) returns (ListPendingPrescriptionsResponse);

  // Delegates a prescription.
  rpc DelegatePrescriptionApproval(DelegatePrescriptionApprovalRequest) returns (DelegatePrescriptionApprovalResponse);

  // Recalls a prescription.
  rpc RecallPrescription(RecallPrescriptionRequest) returns (RecallPrescriptionResponse);

  // Returns a prescription.
  rpc GetPrescriptionApprovalStatus(GetPrescriptionApprovalStatusRequest) returns (GetPrescriptionApprovalStatusResponse);

  // Comments a prescription.
  rpc CommentPrescriptionApproval(CommentPrescriptionApprovalRequest) returns (CommentPrescriptionApprovalResponse);
}

// The request of `SubmitPrescription`.
message SubmitPrescriptionRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  SubmitPrescriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPrescription`.
message SubmitPrescriptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  SubmitPrescriptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

