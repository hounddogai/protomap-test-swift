syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicationWorkflowServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Runs the long-lived workflow that takes a medication from start to finish.
service MedicationWorkflowService {
  // Starts a medication.
  rpc StartMedicationWorkflow(StartMedicationWorkflowRequest) returns (StartMedicationWorkflowResponse);

  // Advances a medication.
  rpc AdvanceMedicationWorkflow(AdvanceMedicationWorkflowRequest) returns (AdvanceMedicationWorkflowResponse);

  // Cancels a medication.
  rpc CancelMedicationWorkflow(CancelMedicationWorkflowRequest) returns (CancelMedicationWorkflowResponse);

  // Retrys a medication.
  rpc RetryMedicationWorkflow(RetryMedicationWorkflowRequest) returns (RetryMedicationWorkflowResponse);

  // Pauses a medication.
  rpc PauseMedicationWorkflow(PauseMedicationWorkflowRequest) returns (PauseMedicationWorkflowResponse);

  // Resumes a medication.
  rpc ResumeMedicationWorkflow(ResumeMedicationWorkflowRequest) returns (ResumeMedicationWorkflowResponse);

  // Returns a medication.
  rpc InspectMedicationWorkflow(InspectMedicationWorkflowRequest) returns (InspectMedicationWorkflowResponse);

  // Lists medications a page at a time.
  rpc ListMedicationWorkflows(ListMedicationWorkflowsRequest) returns (ListMedicationWorkflowsResponse);

  // Signals a medication.
  rpc SignalMedicationWorkflow(SignalMedicationWorkflowRequest) returns (SignalMedicationWorkflowResponse);
}

// The request of `StartMedicationWorkflow`.
message StartMedicationWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  Medication medication = 3;
  StartMedicationWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMedicationWorkflow`.
message StartMedicationWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Medication medication = 1;
  StartMedicationWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

