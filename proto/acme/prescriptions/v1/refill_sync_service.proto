syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillSyncServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Keeps refills in step with the systems of record in other regions.
service RefillSyncService {
  // Syncs a refill.
  rpc SyncRefills(SyncRefillsRequest) returns (SyncRefillsResponse);

  // Pushs a refill.
  rpc PushRefill(PushRefillRequest) returns (PushRefillResponse);

  // Reconciles a refill.
  rpc ReconcileRefills(ReconcileRefillsRequest) returns (ReconcileRefillsResponse);

  // Resolves a refill.
  rpc ResolveRefillConflict(ResolveRefillConflictRequest) returns (ResolveRefillConflictResponse);

  // Returns a refill.
  rpc GetRefillSyncState(GetRefillSyncStateRequest) returns (GetRefillSyncStateResponse);

  // Lists refills a page at a time.
  rpc ListRefillConflicts(ListRefillConflictsRequest) returns (ListRefillConflictsResponse);
}

// The request of `SyncRefills`.
message SyncRefillsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  SyncRefillsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncRefills`.
message SyncRefillsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  SyncRefillsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushRefill`.
message PushRefillRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  PushRefillRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushRefill`.
message PushRefillResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  PushRefillResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcileRefills`.
message ReconcileRefillsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  ReconcileRefillsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcileRefills`.
message ReconcileRefillsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ReconcileRefillsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveRefillConflict`.
message ResolveRefillConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  ResolveRefillConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolveRefillConflict`.
message ResolveRefillConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ResolveRefillConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRefillSyncState`.
message GetRefillSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRefillSyncState`.
message GetRefillSyncStateResponse {
  Refill refill = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListRefillConflicts`.
message ListRefillConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefillStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRefillConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRefillConflicts`.
message ListRefillConflictsResponse {
  repeated Refill refills = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
