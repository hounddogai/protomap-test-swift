syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicationReportingServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Builds and schedules reports about medications.
service MedicationReportingService {
  // Generates a medication.
  rpc GenerateMedicationReport(GenerateMedicationReportRequest) returns (GenerateMedicationReportResponse);

  // Returns a medication.
  rpc FetchMedicationReport(FetchMedicationReportRequest) returns (FetchMedicationReportResponse);

  // Schedules a medication.
  rpc ScheduleMedicationReport(ScheduleMedicationReportRequest) returns (ScheduleMedicationReportResponse);

  // Streams the changes of medications as they happen.
  rpc StreamMedicationMetrics(StreamMedicationMetricsRequest) returns (stream StreamMedicationMetricsResponse);

  // Lists medications a page at a time.
  rpc ListMedicationReports(ListMedicationReportsRequest) returns (ListMedicationReportsResponse);

  // Shares a medication.
  rpc ShareMedicationReport(ShareMedicationReportRequest) returns (ShareMedicationReportResponse);

  // Counts medications by status.
  rpc CountMedicationTotals(CountMedicationTotalsRequest) returns (CountMedicationTotalsResponse);

  // Deletes a medication.
  rpc DeleteMedicationReport(DeleteMedicationReportRequest) returns (DeleteMedicationReportResponse);
}

// The request of `GenerateMedicationReport`.
message GenerateMedicationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  GenerateMedicationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateMedicationReport`.
message GenerateMedicationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchMedicationReport`.
message FetchMedicationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchMedicationReport`.
message FetchMedicationReportResponse {
  Medication medication = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleMedicationReport`.
message ScheduleMedicationReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  ScheduleMedicationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleMedicationReport`.
message ScheduleMedicationReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamMedicationMetrics`.
message StreamMedicationMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamMedicationMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamMedicationMetrics`.
message StreamMedicationMetricsResponse {
  Medication medication = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListMedicationReports`.
message ListMedicationReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListMedicationReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListMedicationReports`.
message ListMedicationReportsResponse {
  repeated Medication medications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareMedicationReport`.
message ShareMedicationReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  ShareMedicationReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareMedicationReport`.
message ShareMedicationReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Medication medication = 1;
  ShareMedicationReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountMedicationTotals`.
message CountMedicationTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountMedicationTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountMedicationTotals`.
message CountMedicationTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteMedicationReport`.
message DeleteMedicationReportRequest {
  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteMedicationReport`.
message DeleteMedicationReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
