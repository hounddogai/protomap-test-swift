    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ExplainRefillCalculationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetRefillRates`.
message GetRefillRatesRequest {
