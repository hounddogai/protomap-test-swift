syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillCalculationServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Computes the figures of a refill, such as totals, taxes, and estimates.
service RefillCalculationService {
  // Calculates a refill.
  rpc CalculateRefill(CalculateRefillRequest) returns (CalculateRefillResponse);

  // Estimates a refill.
  rpc EstimateRefill(EstimateRefillRequest) returns (EstimateRefillResponse);

  // Quotes a refill.
  rpc QuoteRefill(QuoteRefillRequest) returns (QuoteRefillResponse);

  // Compares a refill.
  rpc CompareRefillOptions(CompareRefillOptionsRequest) returns (CompareRefillOptionsResponse);

  // Recalculates a refill.
  rpc RecalculateRefills(RecalculateRefillsRequest) returns (RecalculateRefillsResponse);

  // Simulates a refill.
  rpc SimulateRefill(SimulateRefillRequest) returns (SimulateRefillResponse);

  // Explains a refill.
  rpc ExplainRefillCalculation(ExplainRefillCalculationRequest) returns (ExplainRefillCalculationResponse);

  // Returns a refill.
  rpc GetRefillRates(GetRefillRatesRequest) returns (GetRefillRatesResponse);
}

// The request of `CalculateRefill`.
message CalculateRefillRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  CalculateRefillRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateRefill`.
message CalculateRefillResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateRefillResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Refill refill = 1;
  CalculateRefillResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

