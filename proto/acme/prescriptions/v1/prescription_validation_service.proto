// The request of `ScorePrescription`.
message ScorePrescriptionRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  ScorePrescriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ScorePrescription`.
message ScorePrescriptionResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated ScorePrescriptionResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Prescription prescription = 1;
  ScorePrescriptionResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPrescriptionRules`.
message GetPrescriptionRulesRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPrescriptionRules`.
message GetPrescriptionRulesResponse {
  Prescription prescription = 1;
  acme.common.v1.OperationResult result = 2;
}
