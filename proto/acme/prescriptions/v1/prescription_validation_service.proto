syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "PrescriptionValidationServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Checks prescriptions against the rules before anything acts on them.
service PrescriptionValidationService {
  // Validates a prescription.
  rpc ValidatePrescription(ValidatePrescriptionRequest) returns (ValidatePrescriptionResponse);

  // Previews a prescription.
  rpc PreviewPrescription(PreviewPrescriptionRequest) returns (PreviewPrescriptionResponse);

  // Checks a prescription.
  rpc CheckPrescriptionEligibility(CheckPrescriptionEligibilityRequest) returns (CheckPrescriptionEligibilityResponse);

  // Normalizes a prescription.
  rpc NormalizePrescription(NormalizePrescriptionRequest) returns (NormalizePrescriptionResponse);

  // Explains a prescription.
  rpc ExplainPrescriptionDecision(ExplainPrescriptionDecisionRequest) returns (ExplainPrescriptionDecisionResponse);

  // Scores a prescription.
  rpc ScorePrescription(ScorePrescriptionRequest) returns (ScorePrescriptionResponse);

  // Returns a prescription.
  rpc GetPrescriptionRules(GetPrescriptionRulesRequest) returns (GetPrescriptionRulesResponse);
}

// The request of `ValidatePrescription`.
message ValidatePrescriptionRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  ValidatePrescriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePrescription`.
message ValidatePrescriptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  ValidatePrescriptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

