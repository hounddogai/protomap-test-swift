syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "PrescriptionSyncServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Keeps prescriptions in step with the systems of record in other regions.
service PrescriptionSyncService {
  // Syncs a prescription.
  rpc SyncPrescriptions(SyncPrescriptionsRequest) returns (SyncPrescriptionsResponse);

  // Pushs a prescription.
  rpc PushPrescription(PushPrescriptionRequest) returns (PushPrescriptionResponse);

  // Reconciles a prescription.
  rpc ReconcilePrescriptions(ReconcilePrescriptionsRequest) returns (ReconcilePrescriptionsResponse);

  // Exchanges changes of prescriptions with a peer.
  rpc StreamPrescriptionChanges(stream StreamPrescriptionChangesRequest) returns (stream StreamPrescriptionChangesResponse);

  // Resolves a prescription.
  rpc ResolvePrescriptionConflict(ResolvePrescriptionConflictRequest) returns (ResolvePrescriptionConflictResponse);

  // Returns a prescription.
  rpc GetPrescriptionSyncState(GetPrescriptionSyncStateRequest) returns (GetPrescriptionSyncStateResponse);

  // Lists prescriptions a page at a time.
  rpc ListPrescriptionConflicts(ListPrescriptionConflictsRequest) returns (ListPrescriptionConflictsResponse);
}

// The request of `SyncPrescriptions`.
message SyncPrescriptionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  SyncPrescriptionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPrescriptions`.
message SyncPrescriptionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  SyncPrescriptionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPrescription`.
message PushPrescriptionRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  PushPrescriptionRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushPrescription`.
message PushPrescriptionResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  PushPrescriptionResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ReconcilePrescriptions`.
message ReconcilePrescriptionsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  ReconcilePrescriptionsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ReconcilePrescriptions`.
message ReconcilePrescriptionsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  ReconcilePrescriptionsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `StreamPrescriptionChanges`.
message StreamPrescriptionChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Prescription change = 2;
    StreamPrescriptionChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamPrescriptionChanges`.
message StreamPrescriptionChangesResponse {
  Prescription prescription = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolvePrescriptionConflict`.
message ResolvePrescriptionConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  Prescription prescription = 3;
  ResolvePrescriptionConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolvePrescriptionConflict`.
message ResolvePrescriptionConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Prescription prescription = 1;
  ResolvePrescriptionConflictResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetPrescriptionSyncState`.
message GetPrescriptionSyncStateRequest {
  acme.common.v1.RequestContext context = 1;
  string prescription_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetPrescriptionSyncState`.
message GetPrescriptionSyncStateResponse {
  Prescription prescription = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ListPrescriptionConflicts`.
message ListPrescriptionConflictsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PrescriptionStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPrescriptionConflictsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPrescriptionConflicts`.
message ListPrescriptionConflictsResponse {
  repeated Prescription prescriptions = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}
