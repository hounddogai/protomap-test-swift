syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicationLifecycleServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Moves a medication between the states of its lifecycle.
service MedicationLifecycleService {
  // Activates a medication.
  rpc ActivateMedication(ActivateMedicationRequest) returns (ActivateMedicationResponse);

  // Suspends a medication.
  rpc SuspendMedication(SuspendMedicationRequest) returns (SuspendMedicationResponse);

  // Reinstates a medication.
  rpc ReinstateMedication(ReinstateMedicationRequest) returns (ReinstateMedicationResponse);

  // Terminates a medication.
  rpc TerminateMedication(TerminateMedicationRequest) returns (TerminateMedicationResponse);

  // Renews a medication.
  rpc RenewMedication(RenewMedicationRequest) returns (RenewMedicationResponse);

  // Expires a medication.
  rpc ExpireMedication(ExpireMedicationRequest) returns (ExpireMedicationResponse);

  // Returns a medication.
  rpc GetMedicationLifecycle(GetMedicationLifecycleRequest) returns (GetMedicationLifecycleResponse);

  // Schedules a medication.
  rpc ScheduleMedicationExpiry(ScheduleMedicationExpiryRequest) returns (ScheduleMedicationExpiryResponse);
}

// The request of `ActivateMedication`.
message ActivateMedicationRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  ActivateMedicationRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateMedication`.
message ActivateMedicationResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Medication medication = 1;
  ActivateMedicationResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

