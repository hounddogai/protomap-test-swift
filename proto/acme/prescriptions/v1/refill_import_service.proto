syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillImportServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Takes refills in bulk from partners and legacy systems.
service RefillImportService {
  // Takes a stream of refills and answers once at the end.
  rpc ImportRefills(stream ImportRefillsRequest) returns (ImportRefillsResponse);

  // Returns a refill.
  rpc GetRefillImportStatus(GetRefillImportStatusRequest) returns (GetRefillImportStatusResponse);

  // Cancels a refill.
  rpc CancelRefillImport(CancelRefillImportRequest) returns (CancelRefillImportResponse);

  // Validates a refill.
  rpc ValidateRefillImport(ValidateRefillImportRequest) returns (ValidateRefillImportResponse);

  // Lists refills a page at a time.
  rpc ListRefillImports(ListRefillImportsRequest) returns (ListRefillImportsResponse);

  // Retrys a refill.
  rpc RetryRefillImport(RetryRefillImportRequest) returns (RetryRefillImportResponse);

  // Maps a refill.
  rpc MapRefillImportColumns(MapRefillImportColumnsRequest) returns (MapRefillImportColumnsResponse);
}

// The request of `ImportRefills`.
message ImportRefillsRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportRefillsRequest.StreamHeader header = 2;
    Refill record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportRefills`.
message ImportRefillsResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string refill_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportRefillsResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetRefillImportStatus`.
message GetRefillImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetRefillImportStatus`.
message GetRefillImportStatusResponse {
  Refill refill = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelRefillImport`.
message CancelRefillImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  CancelRefillImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelRefillImport`.
message CancelRefillImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  CancelRefillImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateRefillImport`.
message ValidateRefillImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  ValidateRefillImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRefillImport`.
message ValidateRefillImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ValidateRefillImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListRefillImports`.
message ListRefillImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated RefillStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListRefillImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListRefillImports`.
message ListRefillImportsResponse {
  repeated Refill refills = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryRefillImport`.
message RetryRefillImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  RetryRefillImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryRefillImport`.
message RetryRefillImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  RetryRefillImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapRefillImportColumns`.
message MapRefillImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  MapRefillImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapRefillImportColumns`.
message MapRefillImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  MapRefillImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
