syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillApprovalServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Routes refills through approval, with escalation and delegation.
service RefillApprovalService {
  // Submits a refill.
  rpc SubmitRefill(SubmitRefillRequest) returns (SubmitRefillResponse);

  // Approves a refill.
  rpc ApproveRefill(ApproveRefillRequest) returns (ApproveRefillResponse);

  // Escalates a refill.
  rpc EscalateRefill(EscalateRefillRequest) returns (EscalateRefillResponse);

  // Lists refills a page at a time.
  rpc ListPendingRefills(ListPendingRefillsRequest) returns (ListPendingRefillsResponse);

  // Delegates a refill.
  rpc DelegateRefillApproval(DelegateRefillApprovalRequest) returns (DelegateRefillApprovalResponse);

  // Recalls a refill.
  rpc RecallRefill(RecallRefillRequest) returns (RecallRefillResponse);

  // Returns a refill.
  rpc GetRefillApprovalStatus(GetRefillApprovalStatusRequest) returns (GetRefillApprovalStatusResponse);

  // Comments a refill.
  rpc CommentRefillApproval(CommentRefillApprovalRequest) returns (CommentRefillApprovalResponse);
}

// The request of `SubmitRefill`.
message SubmitRefillRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  SubmitRefillRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitRefill`.
message SubmitRefillResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  SubmitRefillResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveRefill`.
message ApproveRefillRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
