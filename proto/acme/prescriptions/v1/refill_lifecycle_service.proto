syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillLifecycleServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Moves a refill between the states of its lifecycle.
service RefillLifecycleService {
  // Activates a refill.
  rpc ActivateRefill(ActivateRefillRequest) returns (ActivateRefillResponse);

  // Suspends a refill.
  rpc SuspendRefill(SuspendRefillRequest) returns (SuspendRefillResponse);

  // Reinstates a refill.
  rpc ReinstateRefill(ReinstateRefillRequest) returns (ReinstateRefillResponse);

  // Terminates a refill.
  rpc TerminateRefill(TerminateRefillRequest) returns (TerminateRefillResponse);

  // Renews a refill.
  rpc RenewRefill(RenewRefillRequest) returns (RenewRefillResponse);

  // Expires a refill.
  rpc ExpireRefill(ExpireRefillRequest) returns (ExpireRefillResponse);

  // Returns a refill.
  rpc GetRefillLifecycle(GetRefillLifecycleRequest) returns (GetRefillLifecycleResponse);

  // Schedules a refill.
  rpc ScheduleRefillExpiry(ScheduleRefillExpiryRequest) returns (ScheduleRefillExpiryResponse);
}

// The request of `ActivateRefill`.
message ActivateRefillRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  ActivateRefillRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateRefill`.
message ActivateRefillResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ActivateRefillResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

