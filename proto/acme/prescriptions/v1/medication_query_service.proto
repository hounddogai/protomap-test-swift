syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicationQueryServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Answers read-only questions about medications, for screens and reports.
service MedicationQueryService {
  // Returns a medication.
  rpc LookupMedication(LookupMedicationRequest) returns (LookupMedicationResponse);

  // Lists medications a page at a time.
  rpc BrowseMedications(BrowseMedicationsRequest) returns (BrowseMedicationsResponse);

  // Lists medications a page at a time.
  rpc FindMedications(FindMedicationsRequest) returns (FindMedicationsResponse);

  // Counts medications by status.
  rpc CountMedications(CountMedicationsRequest) returns (CountMedicationsResponse);

  // Returns several medications at once.
  rpc ResolveMedications(ResolveMedicationsRequest) returns (ResolveMedicationsResponse);

  // Streams every matching medication.
  rpc ExportMedications(ExportMedicationsRequest) returns (stream ExportMedicationsResponse);

  // Summarizes a medication.
  rpc SummarizeMedications(SummarizeMedicationsRequest) returns (SummarizeMedicationsResponse);

  // Lists medications a page at a time.
  rpc SuggestMedications(SuggestMedicationsRequest) returns (SuggestMedicationsResponse);

  // Returns a medication.
  rpc PeekMedication(PeekMedicationRequest) returns (PeekMedicationResponse);
}

// The request of `LookupMedication`.
message LookupMedicationRequest {
  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `LookupMedication`.
message LookupMedicationResponse {
  Medication medication = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `BrowseMedications`.
message BrowseMedicationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  BrowseMedicationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `BrowseMedications`.
message BrowseMedicationsResponse {
  repeated Medication medications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `FindMedications`.
message FindMedicationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  FindMedicationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `FindMedications`.
message FindMedicationsResponse {
  repeated Medication medications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountMedications`.
message CountMedicationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountMedicationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountMedications`.
message CountMedicationsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ResolveMedications`.
message ResolveMedicationsRequest {
  acme.common.v1.RequestContext context = 1;
  repeated string medication_ids = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `ResolveMedications`.
message ResolveMedicationsResponse {
  repeated Medication medications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ExportMedications`.
message ExportMedicationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  ExportMedicationsRequest.Filter filter = 2;
  string format = 3;
  google.protobuf.FieldMask fields = 4;
  string destination_uri = 5;
}

// The response of `ExportMedications`.
message ExportMedicationsResponse {
  Medication medication = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SummarizeMedications`.
message SummarizeMedicationsRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  SummarizeMedicationsRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SummarizeMedications`.
message SummarizeMedicationsResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `SuggestMedications`.
message SuggestMedicationsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated MedicationStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  SuggestMedicationsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `SuggestMedications`.
message SuggestMedicationsResponse {
  repeated Medication medications = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PeekMedication`.
message PeekMedicationRequest {
  acme.common.v1.RequestContext context = 1;
  string medication_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `PeekMedication`.
message PeekMedicationResponse {
  Medication medication = 1;
  acme.common.v1.OperationResult result = 2;
}
