syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillWorkflowServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Runs the long-lived workflow that takes a refill from start to finish.
service RefillWorkflowService {
  // Starts a refill.
  rpc StartRefillWorkflow(StartRefillWorkflowRequest) returns (StartRefillWorkflowResponse);

  // Advances a refill.
  rpc AdvanceRefillWorkflow(AdvanceRefillWorkflowRequest) returns (AdvanceRefillWorkflowResponse);

  // Cancels a refill.
  rpc CancelRefillWorkflow(CancelRefillWorkflowRequest) returns (CancelRefillWorkflowResponse);

  // Retrys a refill.
  rpc RetryRefillWorkflow(RetryRefillWorkflowRequest) returns (RetryRefillWorkflowResponse);

  // Pauses a refill.
  rpc PauseRefillWorkflow(PauseRefillWorkflowRequest) returns (PauseRefillWorkflowResponse);

  // Resumes a refill.
  rpc ResumeRefillWorkflow(ResumeRefillWorkflowRequest) returns (ResumeRefillWorkflowResponse);

  // Returns a refill.
  rpc InspectRefillWorkflow(InspectRefillWorkflowRequest) returns (InspectRefillWorkflowResponse);

  // Lists refills a page at a time.
  rpc ListRefillWorkflows(ListRefillWorkflowsRequest) returns (ListRefillWorkflowsResponse);

  // Signals a refill.
  rpc SignalRefillWorkflow(SignalRefillWorkflowRequest) returns (SignalRefillWorkflowResponse);
}

// The request of `StartRefillWorkflow`.
message StartRefillWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  StartRefillWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartRefillWorkflow`.
message StartRefillWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  StartRefillWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

