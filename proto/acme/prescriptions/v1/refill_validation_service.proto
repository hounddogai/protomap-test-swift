syntax = "proto3";

package acme.prescriptions.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/prescriptions/v1/prescriptions.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Prescriptions.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/prescriptions/v1;prescriptionsv1";
option java_multiple_files = true;
option java_outer_classname = "RefillValidationServiceProto";
option java_package = "com.acme.prescriptions.v1";

// Checks refills against the rules before anything acts on them.
service RefillValidationService {
  // Validates a refill.
  rpc ValidateRefill(ValidateRefillRequest) returns (ValidateRefillResponse);

  // Previews a refill.
  rpc PreviewRefill(PreviewRefillRequest) returns (PreviewRefillResponse);

  // Checks a refill.
  rpc CheckRefillEligibility(CheckRefillEligibilityRequest) returns (CheckRefillEligibilityResponse);

  // Normalizes a refill.
  rpc NormalizeRefill(NormalizeRefillRequest) returns (NormalizeRefillResponse);

  // Explains a refill.
  rpc ExplainRefillDecision(ExplainRefillDecisionRequest) returns (ExplainRefillDecisionResponse);

  // Scores a refill.
  rpc ScoreRefill(ScoreRefillRequest) returns (ScoreRefillResponse);

  // Lints a refill.
  rpc LintRefills(LintRefillsRequest) returns (LintRefillsResponse);

  // Returns a refill.
  rpc GetRefillRules(GetRefillRulesRequest) returns (GetRefillRulesResponse);
}

// The request of `ValidateRefill`.
message ValidateRefillRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string refill_id = 2;
  Refill refill = 3;
  ValidateRefillRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateRefill`.
message ValidateRefillResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Refill refill = 1;
  ValidateRefillResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

