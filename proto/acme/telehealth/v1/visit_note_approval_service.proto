syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VisitNoteApprovalServiceProto";
option java_package = "com.acme.telehealth.v1";

// Routes visit notes through approval, with escalation and delegation.
service VisitNoteApprovalService {
  // Submits a visit note.
  rpc SubmitVisitNote(SubmitVisitNoteRequest) returns (SubmitVisitNoteResponse);

  // Approves a visit note.
  rpc ApproveVisitNote(ApproveVisitNoteRequest) returns (ApproveVisitNoteResponse);

  // Rejects a visit note.
  rpc RejectVisitNote(RejectVisitNoteRequest) returns (RejectVisitNoteResponse);

  // Lists visit notes a page at a time.
  rpc ListPendingVisitNotes(ListPendingVisitNotesRequest) returns (ListPendingVisitNotesResponse);

  // Recalls a visit note.
  rpc RecallVisitNote(RecallVisitNoteRequest) returns (RecallVisitNoteResponse);

  // Comments a visit note.
  rpc CommentVisitNoteApproval(CommentVisitNoteApprovalRequest) returns (CommentVisitNoteApprovalResponse);
}

// The request of `SubmitVisitNote`.
message SubmitVisitNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visit_note_id = 2;
  VisitNote visit_note = 3;
  SubmitVisitNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVisitNote`.
message SubmitVisitNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitNote visit_note = 1;
  SubmitVisitNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveVisitNote`.
message ApproveVisitNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
