option java_outer_classname = "VisitNoteWorkflowServiceProto";
option java_package = "com.acme.telehealth.v1";

// Runs the long-lived workflow that takes a visit note from start to finish.
service VisitNoteWorkflowService {
  // Starts a visit note.
  rpc StartVisitNoteWorkflow(StartVisitNoteWorkflowRequest) returns (StartVisitNoteWorkflowResponse);

  // Advances a visit note.
  rpc AdvanceVisitNoteWorkflow(AdvanceVisitNoteWorkflowRequest) returns (AdvanceVisitNoteWorkflowResponse);

  // Cancels a visit note.
  rpc CancelVisitNoteWorkflow(CancelVisitNoteWorkflowRequest) returns (CancelVisitNoteWorkflowResponse);

  // Retrys a visit note.
  rpc RetryVisitNoteWorkflow(RetryVisitNoteWorkflowRequest) returns (RetryVisitNoteWorkflowResponse);

  // Pauses a visit note.
  rpc PauseVisitNoteWorkflow(PauseVisitNoteWorkflowRequest) returns (PauseVisitNoteWorkflowResponse);

  // Resumes a visit note.
  rpc ResumeVisitNoteWorkflow(ResumeVisitNoteWorkflowRequest) returns (ResumeVisitNoteWorkflowResponse);

  // Returns a visit note.
  rpc InspectVisitNoteWorkflow(InspectVisitNoteWorkflowRequest) returns (InspectVisitNoteWorkflowResponse);

  // Lists visit notes a page at a time.
  rpc ListVisitNoteWorkflows(ListVisitNoteWorkflowsRequest) returns (ListVisitNoteWorkflowsResponse);

  // Signals a visit note.
  rpc SignalVisitNoteWorkflow(SignalVisitNoteWorkflowRequest) returns (SignalVisitNoteWorkflowResponse);
}

// The request of `StartVisitNoteWorkflow`.
message StartVisitNoteWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visit_note_id = 2;
  VisitNote visit_note = 3;
  StartVisitNoteWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVisitNoteWorkflow`.
message StartVisitNoteWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitNote visit_note = 1;
  StartVisitNoteWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

