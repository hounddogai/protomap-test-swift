syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "TriageApprovalServiceProto";
option java_package = "com.acme.telehealth.v1";

// Routes triages through approval, with escalation and delegation.
service TriageApprovalService {
  // Submits a triage.
  rpc SubmitTriage(SubmitTriageRequest) returns (SubmitTriageResponse);

  // Approves a triage.
  rpc ApproveTriage(ApproveTriageRequest) returns (ApproveTriageResponse);

  // Lists triages a page at a time.
  rpc ListPendingTriages(ListPendingTriagesRequest) returns (ListPendingTriagesResponse);

  // Delegates a triage.
  rpc DelegateTriageApproval(DelegateTriageApprovalRequest) returns (DelegateTriageApprovalResponse);

  // Returns a triage.
  rpc GetTriageApprovalStatus(GetTriageApprovalStatusRequest) returns (GetTriageApprovalStatusResponse);

  // Comments a triage.
  rpc CommentTriageApproval(CommentTriageApprovalRequest) returns (CommentTriageApprovalResponse);
}

// The request of `SubmitTriage`.
message SubmitTriageRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  SubmitTriageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitTriage`.
message SubmitTriageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  SubmitTriageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveTriage`.
message ApproveTriageRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  ApproveTriageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ApproveTriage`.
message ApproveTriageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  ApproveTriageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListPendingTriages`.
message ListPendingTriagesRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated TriageStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPendingTriagesRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPendingTriages`.
message ListPendingTriagesResponse {
  repeated Triage triages = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DelegateTriageApproval`.
message DelegateTriageApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  DelegateTriageApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `DelegateTriageApproval`.
message DelegateTriageApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  DelegateTriageApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `GetTriageApprovalStatus`.
message GetTriageApprovalStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetTriageApprovalStatus`.
message GetTriageApprovalStatusResponse {
  Triage triage = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CommentTriageApproval`.
message CommentTriageApprovalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  CommentTriageApprovalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CommentTriageApproval`.
message CommentTriageApprovalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  CommentTriageApprovalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
