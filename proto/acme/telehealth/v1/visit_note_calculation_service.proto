syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VisitNoteCalculationServiceProto";
option java_package = "com.acme.telehealth.v1";

// Computes the figures of a visit note, such as totals, taxes, and estimates.
service VisitNoteCalculationService {
  // Calculates a visit note.
  rpc CalculateVisitNote(CalculateVisitNoteRequest) returns (CalculateVisitNoteResponse);

  // Estimates a visit note.
  rpc EstimateVisitNote(EstimateVisitNoteRequest) returns (EstimateVisitNoteResponse);

  // Quotes a visit note.
  rpc QuoteVisitNote(QuoteVisitNoteRequest) returns (QuoteVisitNoteResponse);

  // Compares a visit note.
  rpc CompareVisitNoteOptions(CompareVisitNoteOptionsRequest) returns (CompareVisitNoteOptionsResponse);

  // Recalculates a visit note.
  rpc RecalculateVisitNotes(RecalculateVisitNotesRequest) returns (RecalculateVisitNotesResponse);

  // Simulates a visit note.
  rpc SimulateVisitNote(SimulateVisitNoteRequest) returns (SimulateVisitNoteResponse);

  // Explains a visit note.
  rpc ExplainVisitNoteCalculation(ExplainVisitNoteCalculationRequest) returns (ExplainVisitNoteCalculationResponse);

  // Returns a visit note.
  rpc GetVisitNoteRates(GetVisitNoteRatesRequest) returns (GetVisitNoteRatesResponse);
}

// The request of `CalculateVisitNote`.
message CalculateVisitNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string visit_note_id = 2;
  VisitNote visit_note = 3;
  CalculateVisitNoteRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateVisitNote`.
message CalculateVisitNoteResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateVisitNoteResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  VisitNote visit_note = 1;
  CalculateVisitNoteResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

