syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "TriageWorkflowServiceProto";
option java_package = "com.acme.telehealth.v1";

// Runs the long-lived workflow that takes a triage from start to finish.
service TriageWorkflowService {
  // Starts a triage.
  rpc StartTriageWorkflow(StartTriageWorkflowRequest) returns (StartTriageWorkflowResponse);

  // Advances a triage.
  rpc AdvanceTriageWorkflow(AdvanceTriageWorkflowRequest) returns (AdvanceTriageWorkflowResponse);

  // Cancels a triage.
  rpc CancelTriageWorkflow(CancelTriageWorkflowRequest) returns (CancelTriageWorkflowResponse);

  // Retrys a triage.
  rpc RetryTriageWorkflow(RetryTriageWorkflowRequest) returns (RetryTriageWorkflowResponse);

  // Pauses a triage.
  rpc PauseTriageWorkflow(PauseTriageWorkflowRequest) returns (PauseTriageWorkflowResponse);

  // Resumes a triage.
  rpc ResumeTriageWorkflow(ResumeTriageWorkflowRequest) returns (ResumeTriageWorkflowResponse);

  // Returns a triage.
  rpc InspectTriageWorkflow(InspectTriageWorkflowRequest) returns (InspectTriageWorkflowResponse);

  // Lists triages a page at a time.
  rpc ListTriageWorkflows(ListTriageWorkflowsRequest) returns (ListTriageWorkflowsResponse);
}

// The request of `StartTriageWorkflow`.
message StartTriageWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  StartTriageWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartTriageWorkflow`.
message StartTriageWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  StartTriageWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

