syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VideoVisitValidationServiceProto";
option java_package = "com.acme.telehealth.v1";

// Checks video visits against the rules before anything acts on them.
service VideoVisitValidationService {
  // Validates a video visit.
  rpc ValidateVideoVisit(ValidateVideoVisitRequest) returns (ValidateVideoVisitResponse);

  // Previews a video visit.
  rpc PreviewVideoVisit(PreviewVideoVisitRequest) returns (PreviewVideoVisitResponse);

  // Normalizes a video visit.
  rpc NormalizeVideoVisit(NormalizeVideoVisitRequest) returns (NormalizeVideoVisitResponse);

  // Explains a video visit.
  rpc ExplainVideoVisitDecision(ExplainVideoVisitDecisionRequest) returns (ExplainVideoVisitDecisionResponse);

  // Scores a video visit.
  rpc ScoreVideoVisit(ScoreVideoVisitRequest) returns (ScoreVideoVisitResponse);

  // Lints a video visit.
  rpc LintVideoVisits(LintVideoVisitsRequest) returns (LintVideoVisitsResponse);

  // Returns a video visit.
  rpc GetVideoVisitRules(GetVideoVisitRulesRequest) returns (GetVideoVisitRulesResponse);
}

// The request of `ValidateVideoVisit`.
message ValidateVideoVisitRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string video_visit_id = 2;
  VideoVisit video_visit = 3;
  ValidateVideoVisitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVideoVisit`.
message ValidateVideoVisitResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VideoVisit video_visit = 1;
  ValidateVideoVisitResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

