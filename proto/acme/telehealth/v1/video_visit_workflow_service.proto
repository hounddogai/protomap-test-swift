syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VideoVisitWorkflowServiceProto";
option java_package = "com.acme.telehealth.v1";

// Runs the long-lived workflow that takes a video visit from start to finish.
service VideoVisitWorkflowService {
  // Starts a video visit.
  rpc StartVideoVisitWorkflow(StartVideoVisitWorkflowRequest) returns (StartVideoVisitWorkflowResponse);

  // Advances a video visit.
  rpc AdvanceVideoVisitWorkflow(AdvanceVideoVisitWorkflowRequest) returns (AdvanceVideoVisitWorkflowResponse);

  // Cancels a video visit.
  rpc CancelVideoVisitWorkflow(CancelVideoVisitWorkflowRequest) returns (CancelVideoVisitWorkflowResponse);

  // Retrys a video visit.
  rpc RetryVideoVisitWorkflow(RetryVideoVisitWorkflowRequest) returns (RetryVideoVisitWorkflowResponse);

  // Returns a video visit.
  rpc InspectVideoVisitWorkflow(InspectVideoVisitWorkflowRequest) returns (InspectVideoVisitWorkflowResponse);

  // Lists video visits a page at a time.
  rpc ListVideoVisitWorkflows(ListVideoVisitWorkflowsRequest) returns (ListVideoVisitWorkflowsResponse);

  // Signals a video visit.
  rpc SignalVideoVisitWorkflow(SignalVideoVisitWorkflowRequest) returns (SignalVideoVisitWorkflowResponse);
}

// The request of `StartVideoVisitWorkflow`.
message StartVideoVisitWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string video_visit_id = 2;
  VideoVisit video_visit = 3;
  StartVideoVisitWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVideoVisitWorkflow`.
message StartVideoVisitWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VideoVisit video_visit = 1;
  StartVideoVisitWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

