syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "TriageCalculationServiceProto";
option java_package = "com.acme.telehealth.v1";

// Computes the figures of a triage, such as totals, taxes, and estimates.
service TriageCalculationService {
  // Calculates a triage.
  rpc CalculateTriage(CalculateTriageRequest) returns (CalculateTriageResponse);

  // Estimates a triage.
  rpc EstimateTriage(EstimateTriageRequest) returns (EstimateTriageResponse);

  // Quotes a triage.
  rpc QuoteTriage(QuoteTriageRequest) returns (QuoteTriageResponse);

  // Compares a triage.
  rpc CompareTriageOptions(CompareTriageOptionsRequest) returns (CompareTriageOptionsResponse);

  // Recalculates a triage.
  rpc RecalculateTriages(RecalculateTriagesRequest) returns (RecalculateTriagesResponse);

  // Simulates a triage.
  rpc SimulateTriage(SimulateTriageRequest) returns (SimulateTriageResponse);

  // Explains a triage.
  rpc ExplainTriageCalculation(ExplainTriageCalculationRequest) returns (ExplainTriageCalculationResponse);

  // Returns a triage.
  rpc GetTriageRates(GetTriageRatesRequest) returns (GetTriageRatesResponse);
}

// The request of `CalculateTriage`.
message CalculateTriageRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  CalculateTriageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateTriage`.
message CalculateTriageResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateTriageResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Triage triage = 1;
  CalculateTriageResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

