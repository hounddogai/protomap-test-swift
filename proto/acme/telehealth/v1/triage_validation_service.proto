syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "TriageValidationServiceProto";
option java_package = "com.acme.telehealth.v1";

// Checks triages against the rules before anything acts on them.
service TriageValidationService {
  // Validates a triage.
  rpc ValidateTriage(ValidateTriageRequest) returns (ValidateTriageResponse);

  // Previews a triage.
  rpc PreviewTriage(PreviewTriageRequest) returns (PreviewTriageResponse);

  // Checks a triage.
  rpc CheckTriageEligibility(CheckTriageEligibilityRequest) returns (CheckTriageEligibilityResponse);

  // Normalizes a triage.
  rpc NormalizeTriage(NormalizeTriageRequest) returns (NormalizeTriageResponse);

  // Explains a triage.
  rpc ExplainTriageDecision(ExplainTriageDecisionRequest) returns (ExplainTriageDecisionResponse);

  // Scores a triage.
  rpc ScoreTriage(ScoreTriageRequest) returns (ScoreTriageResponse);

  // Lints a triage.
  rpc LintTriages(LintTriagesRequest) returns (LintTriagesResponse);

  // Returns a triage.
  rpc GetTriageRules(GetTriageRulesRequest) returns (GetTriageRulesResponse);
}

// The request of `ValidateTriage`.
message ValidateTriageRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string triage_id = 2;
  Triage triage = 3;
  ValidateTriageRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateTriage`.
message ValidateTriageResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Triage triage = 1;
  ValidateTriageResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

