option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VisitNoteLifecycleServiceProto";
option java_package = "com.acme.telehealth.v1";

// Moves a visit note between the states of its lifecycle.
service VisitNoteLifecycleService {
  // Activates a visit note.
  rpc ActivateVisitNote(ActivateVisitNoteRequest) returns (ActivateVisitNoteResponse);

  // Suspends a visit note.
  rpc SuspendVisitNote(SuspendVisitNoteRequest) returns (SuspendVisitNoteResponse);

  // Reinstates a visit note.
  rpc ReinstateVisitNote(ReinstateVisitNoteRequest) returns (ReinstateVisitNoteResponse);

  // Terminates a visit note.
  rpc TerminateVisitNote(TerminateVisitNoteRequest) returns (TerminateVisitNoteResponse);

  // Renews a visit note.
  rpc RenewVisitNote(RenewVisitNoteRequest) returns (RenewVisitNoteResponse);

  // Expires a visit note.
  rpc ExpireVisitNote(ExpireVisitNoteRequest) returns (ExpireVisitNoteResponse);

  // Returns a visit note.
  rpc GetVisitNoteLifecycle(GetVisitNoteLifecycleRequest) returns (GetVisitNoteLifecycleResponse);

  // Schedules a visit note.
  rpc ScheduleVisitNoteExpiry(ScheduleVisitNoteExpiryRequest) returns (ScheduleVisitNoteExpiryResponse);
}

// The request of `ActivateVisitNote`.
message ActivateVisitNoteRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string visit_note_id = 2;
  ActivateVisitNoteRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVisitNote`.
message ActivateVisitNoteResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VisitNote visit_note = 1;
  ActivateVisitNoteResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

