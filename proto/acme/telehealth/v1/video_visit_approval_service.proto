syntax = "proto3";

package acme.telehealth.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/telehealth/v1/telehealth.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Telehealth.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/telehealth/v1;telehealthv1";
option java_multiple_files = true;
option java_outer_classname = "VideoVisitApprovalServiceProto";
option java_package = "com.acme.telehealth.v1";

// Routes video visits through approval, with escalation and delegation.
service VideoVisitApprovalService {
  // Submits a video visit.
  rpc SubmitVideoVisit(SubmitVideoVisitRequest) returns (SubmitVideoVisitResponse);

  // Approves a video visit.
  rpc ApproveVideoVisit(ApproveVideoVisitRequest) returns (ApproveVideoVisitResponse);

  // Rejects a video visit.
  rpc RejectVideoVisit(RejectVideoVisitRequest) returns (RejectVideoVisitResponse);

  // Lists video visits a page at a time.
  rpc ListPendingVideoVisits(ListPendingVideoVisitsRequest) returns (ListPendingVideoVisitsResponse);

  // Delegates a video visit.
  rpc DelegateVideoVisitApproval(DelegateVideoVisitApprovalRequest) returns (DelegateVideoVisitApprovalResponse);

  // Recalls a video visit.
  rpc RecallVideoVisit(RecallVideoVisitRequest) returns (RecallVideoVisitResponse);

  // Returns a video visit.
  rpc GetVideoVisitApprovalStatus(GetVideoVisitApprovalStatusRequest) returns (GetVideoVisitApprovalStatusResponse);

  // Comments a video visit.
  rpc CommentVideoVisitApproval(CommentVideoVisitApprovalRequest) returns (CommentVideoVisitApprovalResponse);
}

// The request of `SubmitVideoVisit`.
message SubmitVideoVisitRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string video_visit_id = 2;
  VideoVisit video_visit = 3;
  SubmitVideoVisitRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVideoVisit`.
message SubmitVideoVisitResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  VideoVisit video_visit = 1;
  SubmitVideoVisitResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

