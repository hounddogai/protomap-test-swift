syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanWorkflowServiceProto";
option java_package = "com.acme.careplans.v1";

// Runs the long-lived workflow that takes a care plan from start to finish.
service CarePlanWorkflowService {
  // Starts a care plan.
  rpc StartCarePlanWorkflow(StartCarePlanWorkflowRequest) returns (StartCarePlanWorkflowResponse);

  // Advances a care plan.
  rpc AdvanceCarePlanWorkflow(AdvanceCarePlanWorkflowRequest) returns (AdvanceCarePlanWorkflowResponse);

  // Cancels a care plan.
  rpc CancelCarePlanWorkflow(CancelCarePlanWorkflowRequest) returns (CancelCarePlanWorkflowResponse);

  // Resumes a care plan.
  rpc ResumeCarePlanWorkflow(ResumeCarePlanWorkflowRequest) returns (ResumeCarePlanWorkflowResponse);

  // Returns a care plan.
  rpc InspectCarePlanWorkflow(InspectCarePlanWorkflowRequest) returns (InspectCarePlanWorkflowResponse);

  // Lists care plans a page at a time.
  rpc ListCarePlanWorkflows(ListCarePlanWorkflowsRequest) returns (ListCarePlanWorkflowsResponse);

  // Signals a care plan.
  rpc SignalCarePlanWorkflow(SignalCarePlanWorkflowRequest) returns (SignalCarePlanWorkflowResponse);
}

// The request of `StartCarePlanWorkflow`.
message StartCarePlanWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  CarePlan care_plan = 3;
  StartCarePlanWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCarePlanWorkflow`.
message StartCarePlanWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarePlan care_plan = 1;
  StartCarePlanWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

