syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "VitalWorkflowServiceProto";
option java_package = "com.acme.careplans.v1";

// Runs the long-lived workflow that takes a vital from start to finish.
service VitalWorkflowService {
  // Starts a vital.
  rpc StartVitalWorkflow(StartVitalWorkflowRequest) returns (StartVitalWorkflowResponse);

  // Advances a vital.
  rpc AdvanceVitalWorkflow(AdvanceVitalWorkflowRequest) returns (AdvanceVitalWorkflowResponse);

  // Cancels a vital.
  rpc CancelVitalWorkflow(CancelVitalWorkflowRequest) returns (CancelVitalWorkflowResponse);

  // Retrys a vital.
  rpc RetryVitalWorkflow(RetryVitalWorkflowRequest) returns (RetryVitalWorkflowResponse);

  // Pauses a vital.
  rpc PauseVitalWorkflow(PauseVitalWorkflowRequest) returns (PauseVitalWorkflowResponse);

  // Resumes a vital.
  rpc ResumeVitalWorkflow(ResumeVitalWorkflowRequest) returns (ResumeVitalWorkflowResponse);

  // Returns a vital.
  rpc InspectVitalWorkflow(InspectVitalWorkflowRequest) returns (InspectVitalWorkflowResponse);

  // Lists vitals a page at a time.
  rpc ListVitalWorkflows(ListVitalWorkflowsRequest) returns (ListVitalWorkflowsResponse);
}

// The request of `StartVitalWorkflow`.
message StartVitalWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  Vital vital = 3;
  StartVitalWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartVitalWorkflow`.
message StartVitalWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vital vital = 1;
  StartVitalWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

