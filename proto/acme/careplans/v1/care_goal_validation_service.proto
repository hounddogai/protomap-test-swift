syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CareGoalValidationServiceProto";
option java_package = "com.acme.careplans.v1";

// Checks care goals against the rules before anything acts on them.
service CareGoalValidationService {
  // Validates a care goal.
  rpc ValidateCareGoal(ValidateCareGoalRequest) returns (ValidateCareGoalResponse);

  // Previews a care goal.
  rpc PreviewCareGoal(PreviewCareGoalRequest) returns (PreviewCareGoalResponse);

  // Checks a care goal.
  rpc CheckCareGoalEligibility(CheckCareGoalEligibilityRequest) returns (CheckCareGoalEligibilityResponse);

  // Normalizes a care goal.
  rpc NormalizeCareGoal(NormalizeCareGoalRequest) returns (NormalizeCareGoalResponse);

  // Explains a care goal.
  rpc ExplainCareGoalDecision(ExplainCareGoalDecisionRequest) returns (ExplainCareGoalDecisionResponse);

  // Scores a care goal.
  rpc ScoreCareGoal(ScoreCareGoalRequest) returns (ScoreCareGoalResponse);

  // Lints a care goal.
  rpc LintCareGoals(LintCareGoalsRequest) returns (LintCareGoalsResponse);

  // Returns a care goal.
  rpc GetCareGoalRules(GetCareGoalRulesRequest) returns (GetCareGoalRulesResponse);
}

// The request of `ValidateCareGoal`.
message ValidateCareGoalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string care_goal_id = 2;
  CareGoal care_goal = 3;
  ValidateCareGoalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCareGoal`.
message ValidateCareGoalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareGoal care_goal = 1;
  ValidateCareGoalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

