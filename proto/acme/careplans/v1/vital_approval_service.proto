syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "VitalApprovalServiceProto";
option java_package = "com.acme.careplans.v1";

// Routes vitals through approval, with escalation and delegation.
service VitalApprovalService {
  // Submits a vital.
  rpc SubmitVital(SubmitVitalRequest) returns (SubmitVitalResponse);

  // Approves a vital.
  rpc ApproveVital(ApproveVitalRequest) returns (ApproveVitalResponse);

  // Rejects a vital.
  rpc RejectVital(RejectVitalRequest) returns (RejectVitalResponse);

  // Escalates a vital.
  rpc EscalateVital(EscalateVitalRequest) returns (EscalateVitalResponse);

  // Lists vitals a page at a time.
  rpc ListPendingVitals(ListPendingVitalsRequest) returns (ListPendingVitalsResponse);

  // Delegates a vital.
  rpc DelegateVitalApproval(DelegateVitalApprovalRequest) returns (DelegateVitalApprovalResponse);

  // Recalls a vital.
  rpc RecallVital(RecallVitalRequest) returns (RecallVitalResponse);

  // Returns a vital.
  rpc GetVitalApprovalStatus(GetVitalApprovalStatusRequest) returns (GetVitalApprovalStatusResponse);

  // Comments a vital.
  rpc CommentVitalApproval(CommentVitalApprovalRequest) returns (CommentVitalApprovalResponse);
}

// The request of `SubmitVital`.
message SubmitVitalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  Vital vital = 3;
  SubmitVitalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitVital`.
message SubmitVitalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vital vital = 1;
  SubmitVitalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

