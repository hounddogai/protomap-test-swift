syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanApprovalServiceProto";
option java_package = "com.acme.careplans.v1";

// Routes care plans through approval, with escalation and delegation.
service CarePlanApprovalService {
  // Submits a care plan.
  rpc SubmitCarePlan(SubmitCarePlanRequest) returns (SubmitCarePlanResponse);

  // Approves a care plan.
  rpc ApproveCarePlan(ApproveCarePlanRequest) returns (ApproveCarePlanResponse);

  // Rejects a care plan.
  rpc RejectCarePlan(RejectCarePlanRequest) returns (RejectCarePlanResponse);

  // Lists care plans a page at a time.
  rpc ListPendingCarePlans(ListPendingCarePlansRequest) returns (ListPendingCarePlansResponse);

  // Delegates a care plan.
  rpc DelegateCarePlanApproval(DelegateCarePlanApprovalRequest) returns (DelegateCarePlanApprovalResponse);

  // Returns a care plan.
  rpc GetCarePlanApprovalStatus(GetCarePlanApprovalStatusRequest) returns (GetCarePlanApprovalStatusResponse);

  // Comments a care plan.
  rpc CommentCarePlanApproval(CommentCarePlanApprovalRequest) returns (CommentCarePlanApprovalResponse);
}

// The request of `SubmitCarePlan`.
message SubmitCarePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  CarePlan care_plan = 3;
  SubmitCarePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCarePlan`.
message SubmitCarePlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarePlan care_plan = 1;
  SubmitCarePlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ApproveCarePlan`.
message ApproveCarePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
