syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "VitalLifecycleServiceProto";
option java_package = "com.acme.careplans.v1";

// Moves a vital between the states of its lifecycle.
service VitalLifecycleService {
  // Activates a vital.
  rpc ActivateVital(ActivateVitalRequest) returns (ActivateVitalResponse);

  // Suspends a vital.
  rpc SuspendVital(SuspendVitalRequest) returns (SuspendVitalResponse);

  // Reinstates a vital.
  rpc ReinstateVital(ReinstateVitalRequest) returns (ReinstateVitalResponse);

  // Terminates a vital.
  rpc TerminateVital(TerminateVitalRequest) returns (TerminateVitalResponse);

  // Renews a vital.
  rpc RenewVital(RenewVitalRequest) returns (RenewVitalResponse);

  // Expires a vital.
  rpc ExpireVital(ExpireVitalRequest) returns (ExpireVitalResponse);

  // Returns a vital.
  rpc GetVitalLifecycle(GetVitalLifecycleRequest) returns (GetVitalLifecycleResponse);

  // Schedules a vital.
  rpc ScheduleVitalExpiry(ScheduleVitalExpiryRequest) returns (ScheduleVitalExpiryResponse);
}

// The request of `ActivateVital`.
message ActivateVitalRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  ActivateVitalRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateVital`.
message ActivateVitalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vital vital = 1;
  ActivateVitalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

