syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CareGoalApprovalServiceProto";
option java_package = "com.acme.careplans.v1";

// Routes care goals through approval, with escalation and delegation.
service CareGoalApprovalService {
  // Submits a care goal.
  rpc SubmitCareGoal(SubmitCareGoalRequest) returns (SubmitCareGoalResponse);

  // Approves a care goal.
  rpc ApproveCareGoal(ApproveCareGoalRequest) returns (ApproveCareGoalResponse);

  // Rejects a care goal.
  rpc RejectCareGoal(RejectCareGoalRequest) returns (RejectCareGoalResponse);

  // Escalates a care goal.
  rpc EscalateCareGoal(EscalateCareGoalRequest) returns (EscalateCareGoalResponse);

  // Lists care goals a page at a time.
  rpc ListPendingCareGoals(ListPendingCareGoalsRequest) returns (ListPendingCareGoalsResponse);

  // Delegates a care goal.
  rpc DelegateCareGoalApproval(DelegateCareGoalApprovalRequest) returns (DelegateCareGoalApprovalResponse);

  // Recalls a care goal.
  rpc RecallCareGoal(RecallCareGoalRequest) returns (RecallCareGoalResponse);

  // Comments a care goal.
  rpc CommentCareGoalApproval(CommentCareGoalApprovalRequest) returns (CommentCareGoalApprovalResponse);
}

// The request of `SubmitCareGoal`.
message SubmitCareGoalRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_goal_id = 2;
  CareGoal care_goal = 3;
  SubmitCareGoalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitCareGoal`.
message SubmitCareGoalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareGoal care_goal = 1;
  SubmitCareGoalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

