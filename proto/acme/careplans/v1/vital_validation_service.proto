syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "VitalValidationServiceProto";
option java_package = "com.acme.careplans.v1";

// Checks vitals against the rules before anything acts on them.
service VitalValidationService {
  // Validates a vital.
  rpc ValidateVital(ValidateVitalRequest) returns (ValidateVitalResponse);

  // Previews a vital.
  rpc PreviewVital(PreviewVitalRequest) returns (PreviewVitalResponse);

  // Checks a vital.
  rpc CheckVitalEligibility(CheckVitalEligibilityRequest) returns (CheckVitalEligibilityResponse);

  // Normalizes a vital.
  rpc NormalizeVital(NormalizeVitalRequest) returns (NormalizeVitalResponse);

  // Explains a vital.
  rpc ExplainVitalDecision(ExplainVitalDecisionRequest) returns (ExplainVitalDecisionResponse);

  // Scores a vital.
  rpc ScoreVital(ScoreVitalRequest) returns (ScoreVitalResponse);

  // Lints a vital.
  rpc LintVitals(LintVitalsRequest) returns (LintVitalsResponse);

  // Returns a vital.
  rpc GetVitalRules(GetVitalRulesRequest) returns (GetVitalRulesResponse);
}

// The request of `ValidateVital`.
message ValidateVitalRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  Vital vital = 3;
  ValidateVitalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateVital`.
message ValidateVitalResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vital vital = 1;
  ValidateVitalResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

