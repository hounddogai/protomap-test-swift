syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CareGoalCalculationServiceProto";
option java_package = "com.acme.careplans.v1";

// Computes the figures of a care goal, such as totals, taxes, and estimates.
service CareGoalCalculationService {
  // Calculates a care goal.
  rpc CalculateCareGoal(CalculateCareGoalRequest) returns (CalculateCareGoalResponse);

  // Estimates a care goal.
  rpc EstimateCareGoal(EstimateCareGoalRequest) returns (EstimateCareGoalResponse);

  // Quotes a care goal.
  rpc QuoteCareGoal(QuoteCareGoalRequest) returns (QuoteCareGoalResponse);

  // Compares a care goal.
  rpc CompareCareGoalOptions(CompareCareGoalOptionsRequest) returns (CompareCareGoalOptionsResponse);

  // Recalculates a care goal.
  rpc RecalculateCareGoals(RecalculateCareGoalsRequest) returns (RecalculateCareGoalsResponse);

  // Simulates a care goal.
  rpc SimulateCareGoal(SimulateCareGoalRequest) returns (SimulateCareGoalResponse);

  // Explains a care goal.
  rpc ExplainCareGoalCalculation(ExplainCareGoalCalculationRequest) returns (ExplainCareGoalCalculationResponse);

  // Returns a care goal.
  rpc GetCareGoalRates(GetCareGoalRatesRequest) returns (GetCareGoalRatesResponse);
}

// The request of `CalculateCareGoal`.
message CalculateCareGoalRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_goal_id = 2;
  CareGoal care_goal = 3;
  CalculateCareGoalRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateCareGoal`.
message CalculateCareGoalResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateCareGoalResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  CareGoal care_goal = 1;
  CalculateCareGoalResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

