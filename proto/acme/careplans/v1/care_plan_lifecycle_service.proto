syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanLifecycleServiceProto";
option java_package = "com.acme.careplans.v1";

// Moves a care plan between the states of its lifecycle.
service CarePlanLifecycleService {
  // Activates a care plan.
  rpc ActivateCarePlan(ActivateCarePlanRequest) returns (ActivateCarePlanResponse);

  // Suspends a care plan.
  rpc SuspendCarePlan(SuspendCarePlanRequest) returns (SuspendCarePlanResponse);

  // Reinstates a care plan.
  rpc ReinstateCarePlan(ReinstateCarePlanRequest) returns (ReinstateCarePlanResponse);

  // Renews a care plan.
  rpc RenewCarePlan(RenewCarePlanRequest) returns (RenewCarePlanResponse);

  // Expires a care plan.
  rpc ExpireCarePlan(ExpireCarePlanRequest) returns (ExpireCarePlanResponse);

  // Returns a care plan.
  rpc GetCarePlanLifecycle(GetCarePlanLifecycleRequest) returns (GetCarePlanLifecycleResponse);

  // Schedules a care plan.
  rpc ScheduleCarePlanExpiry(ScheduleCarePlanExpiryRequest) returns (ScheduleCarePlanExpiryResponse);
}

// The request of `ActivateCarePlan`.
message ActivateCarePlanRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  ActivateCarePlanRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateCarePlan`.
message ActivateCarePlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarePlan care_plan = 1;
  ActivateCarePlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

