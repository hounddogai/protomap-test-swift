syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "VitalReportingServiceProto";
option java_package = "com.acme.careplans.v1";

// Builds and schedules reports about vitals.
service VitalReportingService {
  // Generates a vital.
  rpc GenerateVitalReport(GenerateVitalReportRequest) returns (GenerateVitalReportResponse);

  // Returns a vital.
  rpc FetchVitalReport(FetchVitalReportRequest) returns (FetchVitalReportResponse);

  // Schedules a vital.
  rpc ScheduleVitalReport(ScheduleVitalReportRequest) returns (ScheduleVitalReportResponse);

  // Streams the changes of vitals as they happen.
  rpc StreamVitalMetrics(StreamVitalMetricsRequest) returns (stream StreamVitalMetricsResponse);

  // Lists vitals a page at a time.
  rpc ListVitalReports(ListVitalReportsRequest) returns (ListVitalReportsResponse);

  // Shares a vital.
  rpc ShareVitalReport(ShareVitalReportRequest) returns (ShareVitalReportResponse);

  // Counts vitals by status.
  rpc CountVitalTotals(CountVitalTotalsRequest) returns (CountVitalTotalsResponse);

  // Deletes a vital.
  rpc DeleteVitalReport(DeleteVitalReportRequest) returns (DeleteVitalReportResponse);
}

// The request of `GenerateVitalReport`.
message GenerateVitalReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  GenerateVitalReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GenerateVitalReport`.
message GenerateVitalReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchVitalReport`.
message FetchVitalReportRequest {
  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchVitalReport`.
message FetchVitalReportResponse {
  Vital vital = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `ScheduleVitalReport`.
message ScheduleVitalReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  ScheduleVitalReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ScheduleVitalReport`.
message ScheduleVitalReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamVitalMetrics`.
message StreamVitalMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VitalStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamVitalMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamVitalMetrics`.
message StreamVitalMetricsResponse {
  Vital vital = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListVitalReports`.
message ListVitalReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VitalStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListVitalReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListVitalReports`.
message ListVitalReportsResponse {
  repeated Vital vitals = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ShareVitalReport`.
message ShareVitalReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  ShareVitalReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ShareVitalReport`.
message ShareVitalReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Vital vital = 1;
  ShareVitalReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountVitalTotals`.
message CountVitalTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated VitalStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountVitalTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountVitalTotals`.
message CountVitalTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeleteVitalReport`.
message DeleteVitalReportRequest {
  acme.common.v1.RequestContext context = 1;
  string vital_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeleteVitalReport`.
message DeleteVitalReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
