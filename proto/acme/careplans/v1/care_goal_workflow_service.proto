syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CareGoalWorkflowServiceProto";
option java_package = "com.acme.careplans.v1";

// Runs the long-lived workflow that takes a care goal from start to finish.
service CareGoalWorkflowService {
  // Starts a care goal.
  rpc StartCareGoalWorkflow(StartCareGoalWorkflowRequest) returns (StartCareGoalWorkflowResponse);

  // Advances a care goal.
  rpc AdvanceCareGoalWorkflow(AdvanceCareGoalWorkflowRequest) returns (AdvanceCareGoalWorkflowResponse);

  // Cancels a care goal.
  rpc CancelCareGoalWorkflow(CancelCareGoalWorkflowRequest) returns (CancelCareGoalWorkflowResponse);

  // Retrys a care goal.
  rpc RetryCareGoalWorkflow(RetryCareGoalWorkflowRequest) returns (RetryCareGoalWorkflowResponse);

  // Pauses a care goal.
  rpc PauseCareGoalWorkflow(PauseCareGoalWorkflowRequest) returns (PauseCareGoalWorkflowResponse);

  // Resumes a care goal.
  rpc ResumeCareGoalWorkflow(ResumeCareGoalWorkflowRequest) returns (ResumeCareGoalWorkflowResponse);

  // Returns a care goal.
  rpc InspectCareGoalWorkflow(InspectCareGoalWorkflowRequest) returns (InspectCareGoalWorkflowResponse);

  // Lists care goals a page at a time.
  rpc ListCareGoalWorkflows(ListCareGoalWorkflowsRequest) returns (ListCareGoalWorkflowsResponse);

  // Signals a care goal.
  rpc SignalCareGoalWorkflow(SignalCareGoalWorkflowRequest) returns (SignalCareGoalWorkflowResponse);
}

// The request of `StartCareGoalWorkflow`.
message StartCareGoalWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string care_goal_id = 2;
  CareGoal care_goal = 3;
  StartCareGoalWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartCareGoalWorkflow`.
message StartCareGoalWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CareGoal care_goal = 1;
  StartCareGoalWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

