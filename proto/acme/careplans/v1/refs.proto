syntax = "proto3";

package acme.careplans.v1;

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "RefsProto";
option java_package = "com.acme.careplans.v1";

// A reference to a care plan of the careplans domain.
message CarePlanRef {
  string care_plan_id = 1;
  string display_name = 2;
  string number = 3;
}

// A reference to a care goal of the careplans domain.
message CareGoalRef {
  string care_goal_id = 1;
  string display_name = 2;
  int32 priority = 3;
}

// A reference to a vital of the careplans domain.
message VitalRef {
  string vital_id = 1;
  string display_name = 2;
  string kind = 3;
}
