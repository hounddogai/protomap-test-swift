syntax = "proto3";

package acme.careplans.v1;

import "acme/careplans/v1/careplans.proto";
import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Careplans.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/careplans/v1;careplansv1";
option java_multiple_files = true;
option java_outer_classname = "CarePlanValidationServiceProto";
option java_package = "com.acme.careplans.v1";

// Checks care plans against the rules before anything acts on them.
service CarePlanValidationService {
  // Validates a care plan.
  rpc ValidateCarePlan(ValidateCarePlanRequest) returns (ValidateCarePlanResponse);

  // Previews a care plan.
  rpc PreviewCarePlan(PreviewCarePlanRequest) returns (PreviewCarePlanResponse);

  // Checks a care plan.
  rpc CheckCarePlanEligibility(CheckCarePlanEligibilityRequest) returns (CheckCarePlanEligibilityResponse);

  // Normalizes a care plan.
  rpc NormalizeCarePlan(NormalizeCarePlanRequest) returns (NormalizeCarePlanResponse);

  // Explains a care plan.
  rpc ExplainCarePlanDecision(ExplainCarePlanDecisionRequest) returns (ExplainCarePlanDecisionResponse);

  // Scores a care plan.
  rpc ScoreCarePlan(ScoreCarePlanRequest) returns (ScoreCarePlanResponse);

  // Lints a care plan.
  rpc LintCarePlans(LintCarePlansRequest) returns (LintCarePlansResponse);

  // Returns a care plan.
  rpc GetCarePlanRules(GetCarePlanRulesRequest) returns (GetCarePlanRulesResponse);
}

// The request of `ValidateCarePlan`.
message ValidateCarePlanRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string care_plan_id = 2;
  CarePlan care_plan = 3;
  ValidateCarePlanRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateCarePlan`.
message ValidateCarePlanResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  CarePlan care_plan = 1;
  ValidateCarePlanResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

