    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  ResolvePatientConflictRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ResolvePatientConflict`.
message ResolvePatientConflictResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
