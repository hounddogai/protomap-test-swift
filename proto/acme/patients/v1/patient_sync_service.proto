syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientSyncServiceProto";
option java_package = "com.acme.patients.v1";

// Keeps patients in step with the systems of record in other regions.
service PatientSyncService {
  // Syncs a patient.
  rpc SyncPatients(SyncPatientsRequest) returns (SyncPatientsResponse);

  // Pushs a patient.
  rpc PushPatient(PushPatientRequest) returns (PushPatientResponse);

  // Pulls a patient.
  rpc PullPatients(PullPatientsRequest) returns (PullPatientsResponse);

  // Reconciles a patient.
  rpc ReconcilePatients(ReconcilePatientsRequest) returns (ReconcilePatientsResponse);

  // Exchanges changes of patients with a peer.
  rpc StreamPatientChanges(stream StreamPatientChangesRequest) returns (stream StreamPatientChangesResponse);

  // Resolves a patient.
  rpc ResolvePatientConflict(ResolvePatientConflictRequest) returns (ResolvePatientConflictResponse);

  // Returns a patient.
  rpc GetPatientSyncState(GetPatientSyncStateRequest) returns (GetPatientSyncStateResponse);

  // Lists patients a page at a time.
  rpc ListPatientConflicts(ListPatientConflictsRequest) returns (ListPatientConflictsResponse);
}

// The request of `SyncPatients`.
message SyncPatientsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  SyncPatientsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SyncPatients`.
message SyncPatientsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  SyncPatientsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PushPatient`.
message PushPatientRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  PushPatientRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `PushPatient`.
message PushPatientResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  PushPatientResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `PullPatients`.
message PullPatientsRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
    bytes payload = 2;
    string resolution = 3;
    string peer_region = 4;
    string checksum = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  PullPatientsRequest.Details details = 4;
  string reason = 5;
