// The request of `StreamPatientChanges`.
message StreamPatientChangesRequest {
  // An acknowledgment of a change the peer sent.
  message ChangeAck {
    int64 sequence = 1;
    string status = 2;
  }

  acme.common.v1.RequestContext context = 1;
  oneof frame {
    Patient change = 2;
    StreamPatientChangesRequest.ChangeAck ack = 3;
  }
  string cursor = 4;
}

// The response of `StreamPatientChanges`.
message StreamPatientChangesResponse {
  Patient patient = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ResolvePatientConflict`.
message ResolvePatientConflictRequest {
  // What the operation needs besides the record.
  message Details {
    string cursor = 1;
