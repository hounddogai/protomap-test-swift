syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "AllergyLifecycleServiceProto";
option java_package = "com.acme.patients.v1";

// Moves an allergy between the states of its lifecycle.
service AllergyLifecycleService {
  // Activates an allergy.
  rpc ActivateAllergy(ActivateAllergyRequest) returns (ActivateAllergyResponse);

  // Suspends an allergy.
  rpc SuspendAllergy(SuspendAllergyRequest) returns (SuspendAllergyResponse);

  // Reinstates an allergy.
  rpc ReinstateAllergy(ReinstateAllergyRequest) returns (ReinstateAllergyResponse);

  // Terminates an allergy.
  rpc TerminateAllergy(TerminateAllergyRequest) returns (TerminateAllergyResponse);

  // Renews an allergy.
  rpc RenewAllergy(RenewAllergyRequest) returns (RenewAllergyResponse);

  // Expires an allergy.
  rpc ExpireAllergy(ExpireAllergyRequest) returns (ExpireAllergyResponse);

  // Returns an allergy.
  rpc GetAllergyLifecycle(GetAllergyLifecycleRequest) returns (GetAllergyLifecycleResponse);

  // Schedules an allergy.
  rpc ScheduleAllergyExpiry(ScheduleAllergyExpiryRequest) returns (ScheduleAllergyExpiryResponse);
}

// The request of `ActivateAllergy`.
message ActivateAllergyRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  ActivateAllergyRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateAllergy`.
message ActivateAllergyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  ActivateAllergyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

