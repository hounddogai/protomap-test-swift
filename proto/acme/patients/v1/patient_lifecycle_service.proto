syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientLifecycleServiceProto";
option java_package = "com.acme.patients.v1";

// Moves a patient between the states of its lifecycle.
service PatientLifecycleService {
  // Activates a patient.
  rpc ActivatePatient(ActivatePatientRequest) returns (ActivatePatientResponse);

  // Suspends a patient.
  rpc SuspendPatient(SuspendPatientRequest) returns (SuspendPatientResponse);

  // Terminates a patient.
  rpc TerminatePatient(TerminatePatientRequest) returns (TerminatePatientResponse);

  // Renews a patient.
  rpc RenewPatient(RenewPatientRequest) returns (RenewPatientResponse);

  // Expires a patient.
  rpc ExpirePatient(ExpirePatientRequest) returns (ExpirePatientResponse);

  // Schedules a patient.
  rpc SchedulePatientExpiry(SchedulePatientExpiryRequest) returns (SchedulePatientExpiryResponse);
}

// The request of `ActivatePatient`.
message ActivatePatientRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  ActivatePatientRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivatePatient`.
message ActivatePatientResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  ActivatePatientResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

