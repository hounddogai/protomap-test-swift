syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicalRecordLifecycleServiceProto";
option java_package = "com.acme.patients.v1";

// Moves a medical record between the states of its lifecycle.
service MedicalRecordLifecycleService {
  // Activates a medical record.
  rpc ActivateMedicalRecord(ActivateMedicalRecordRequest) returns (ActivateMedicalRecordResponse);

  // Suspends a medical record.
  rpc SuspendMedicalRecord(SuspendMedicalRecordRequest) returns (SuspendMedicalRecordResponse);

  // Reinstates a medical record.
  rpc ReinstateMedicalRecord(ReinstateMedicalRecordRequest) returns (ReinstateMedicalRecordResponse);

  // Terminates a medical record.
  rpc TerminateMedicalRecord(TerminateMedicalRecordRequest) returns (TerminateMedicalRecordResponse);

  // Renews a medical record.
  rpc RenewMedicalRecord(RenewMedicalRecordRequest) returns (RenewMedicalRecordResponse);

  // Expires a medical record.
  rpc ExpireMedicalRecord(ExpireMedicalRecordRequest) returns (ExpireMedicalRecordResponse);

  // Returns a medical record.
  rpc GetMedicalRecordLifecycle(GetMedicalRecordLifecycleRequest) returns (GetMedicalRecordLifecycleResponse);
}

// The request of `ActivateMedicalRecord`.
message ActivateMedicalRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string medical_record_id = 2;
  ActivateMedicalRecordRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `ActivateMedicalRecord`.
message ActivateMedicalRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MedicalRecord medical_record = 1;
  ActivateMedicalRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

