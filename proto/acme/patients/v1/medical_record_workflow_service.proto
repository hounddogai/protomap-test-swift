syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicalRecordWorkflowServiceProto";
option java_package = "com.acme.patients.v1";

// Runs the long-lived workflow that takes a medical record from start to finish.
service MedicalRecordWorkflowService {
  // Starts a medical record.
  rpc StartMedicalRecordWorkflow(StartMedicalRecordWorkflowRequest) returns (StartMedicalRecordWorkflowResponse);

  // Advances a medical record.
  rpc AdvanceMedicalRecordWorkflow(AdvanceMedicalRecordWorkflowRequest) returns (AdvanceMedicalRecordWorkflowResponse);

  // Cancels a medical record.
  rpc CancelMedicalRecordWorkflow(CancelMedicalRecordWorkflowRequest) returns (CancelMedicalRecordWorkflowResponse);

  // Retrys a medical record.
  rpc RetryMedicalRecordWorkflow(RetryMedicalRecordWorkflowRequest) returns (RetryMedicalRecordWorkflowResponse);

  // Pauses a medical record.
  rpc PauseMedicalRecordWorkflow(PauseMedicalRecordWorkflowRequest) returns (PauseMedicalRecordWorkflowResponse);

  // Resumes a medical record.
  rpc ResumeMedicalRecordWorkflow(ResumeMedicalRecordWorkflowRequest) returns (ResumeMedicalRecordWorkflowResponse);

  // Returns a medical record.
  rpc InspectMedicalRecordWorkflow(InspectMedicalRecordWorkflowRequest) returns (InspectMedicalRecordWorkflowResponse);

  // Lists medical records a page at a time.
  rpc ListMedicalRecordWorkflows(ListMedicalRecordWorkflowsRequest) returns (ListMedicalRecordWorkflowsResponse);

  // Signals a medical record.
  rpc SignalMedicalRecordWorkflow(SignalMedicalRecordWorkflowRequest) returns (SignalMedicalRecordWorkflowResponse);
}

// The request of `StartMedicalRecordWorkflow`.
message StartMedicalRecordWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medical_record_id = 2;
  MedicalRecord medical_record = 3;
  StartMedicalRecordWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartMedicalRecordWorkflow`.
message StartMedicalRecordWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MedicalRecord medical_record = 1;
  StartMedicalRecordWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

