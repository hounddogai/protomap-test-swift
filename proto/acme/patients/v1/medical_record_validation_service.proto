syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicalRecordValidationServiceProto";
option java_package = "com.acme.patients.v1";

// Checks medical records against the rules before anything acts on them.
service MedicalRecordValidationService {
  // Validates a medical record.
  rpc ValidateMedicalRecord(ValidateMedicalRecordRequest) returns (ValidateMedicalRecordResponse);

  // Previews a medical record.
  rpc PreviewMedicalRecord(PreviewMedicalRecordRequest) returns (PreviewMedicalRecordResponse);

  // Checks a medical record.
  rpc CheckMedicalRecordEligibility(CheckMedicalRecordEligibilityRequest) returns (CheckMedicalRecordEligibilityResponse);

  // Explains a medical record.
  rpc ExplainMedicalRecordDecision(ExplainMedicalRecordDecisionRequest) returns (ExplainMedicalRecordDecisionResponse);

  // Scores a medical record.
  rpc ScoreMedicalRecord(ScoreMedicalRecordRequest) returns (ScoreMedicalRecordResponse);

  // Lints a medical record.
  rpc LintMedicalRecords(LintMedicalRecordsRequest) returns (LintMedicalRecordsResponse);

  // Returns a medical record.
  rpc GetMedicalRecordRules(GetMedicalRecordRulesRequest) returns (GetMedicalRecordRulesResponse);
}

// The request of `ValidateMedicalRecord`.
message ValidateMedicalRecordRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string medical_record_id = 2;
  MedicalRecord medical_record = 3;
  ValidateMedicalRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateMedicalRecord`.
message ValidateMedicalRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MedicalRecord medical_record = 1;
  ValidateMedicalRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

