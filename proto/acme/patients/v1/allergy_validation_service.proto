syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "AllergyValidationServiceProto";
option java_package = "com.acme.patients.v1";

// Checks allergies against the rules before anything acts on them.
service AllergyValidationService {
  // Validates an allergy.
  rpc ValidateAllergy(ValidateAllergyRequest) returns (ValidateAllergyResponse);

  // Previews an allergy.
  rpc PreviewAllergy(PreviewAllergyRequest) returns (PreviewAllergyResponse);

  // Checks an allergy.
  rpc CheckAllergyEligibility(CheckAllergyEligibilityRequest) returns (CheckAllergyEligibilityResponse);

  // Normalizes an allergy.
  rpc NormalizeAllergy(NormalizeAllergyRequest) returns (NormalizeAllergyResponse);

  // Scores an allergy.
  rpc ScoreAllergy(ScoreAllergyRequest) returns (ScoreAllergyResponse);

  // Lints an allergy.
  rpc LintAllergies(LintAllergiesRequest) returns (LintAllergiesResponse);

  // Returns an allergy.
  rpc GetAllergyRules(GetAllergyRulesRequest) returns (GetAllergyRulesResponse);
}

// The request of `ValidateAllergy`.
message ValidateAllergyRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  ValidateAllergyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAllergy`.
message ValidateAllergyResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  ValidateAllergyResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

