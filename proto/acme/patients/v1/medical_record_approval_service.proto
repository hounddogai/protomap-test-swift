syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicalRecordApprovalServiceProto";
option java_package = "com.acme.patients.v1";

// Routes medical records through approval, with escalation and delegation.
service MedicalRecordApprovalService {
  // Submits a medical record.
  rpc SubmitMedicalRecord(SubmitMedicalRecordRequest) returns (SubmitMedicalRecordResponse);

  // Approves a medical record.
  rpc ApproveMedicalRecord(ApproveMedicalRecordRequest) returns (ApproveMedicalRecordResponse);

  // Rejects a medical record.
  rpc RejectMedicalRecord(RejectMedicalRecordRequest) returns (RejectMedicalRecordResponse);

  // Escalates a medical record.
  rpc EscalateMedicalRecord(EscalateMedicalRecordRequest) returns (EscalateMedicalRecordResponse);

  // Lists medical records a page at a time.
  rpc ListPendingMedicalRecords(ListPendingMedicalRecordsRequest) returns (ListPendingMedicalRecordsResponse);

  // Delegates a medical record.
  rpc DelegateMedicalRecordApproval(DelegateMedicalRecordApprovalRequest) returns (DelegateMedicalRecordApprovalResponse);

  // Recalls a medical record.
  rpc RecallMedicalRecord(RecallMedicalRecordRequest) returns (RecallMedicalRecordResponse);

  // Returns a medical record.
  rpc GetMedicalRecordApprovalStatus(GetMedicalRecordApprovalStatusRequest) returns (GetMedicalRecordApprovalStatusResponse);

  // Comments a medical record.
  rpc CommentMedicalRecordApproval(CommentMedicalRecordApprovalRequest) returns (CommentMedicalRecordApprovalResponse);
}

// The request of `SubmitMedicalRecord`.
message SubmitMedicalRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medical_record_id = 2;
  MedicalRecord medical_record = 3;
  SubmitMedicalRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitMedicalRecord`.
message SubmitMedicalRecordResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  MedicalRecord medical_record = 1;
  SubmitMedicalRecordResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

