syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/audit.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientReportingServiceProto";
option java_package = "com.acme.patients.v1";

// Builds and schedules reports about patients.
service PatientReportingService {
  // Generates a patient.
  rpc GeneratePatientReport(GeneratePatientReportRequest) returns (GeneratePatientReportResponse);

  // Returns a patient.
  rpc FetchPatientReport(FetchPatientReportRequest) returns (FetchPatientReportResponse);

  // Schedules a patient.
  rpc SchedulePatientReport(SchedulePatientReportRequest) returns (SchedulePatientReportResponse);

  // Streams the changes of patients as they happen.
  rpc StreamPatientMetrics(StreamPatientMetricsRequest) returns (stream StreamPatientMetricsResponse);

  // Lists patients a page at a time.
  rpc ListPatientReports(ListPatientReportsRequest) returns (ListPatientReportsResponse);

  // Shares a patient.
  rpc SharePatientReport(SharePatientReportRequest) returns (SharePatientReportResponse);

  // Counts patients by status.
  rpc CountPatientTotals(CountPatientTotalsRequest) returns (CountPatientTotalsResponse);

  // Deletes a patient.
  rpc DeletePatientReport(DeletePatientReportRequest) returns (DeletePatientReportResponse);
}

// The request of `GeneratePatientReport`.
message GeneratePatientReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  GeneratePatientReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `GeneratePatientReport`.
message GeneratePatientReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `FetchPatientReport`.
message FetchPatientReportRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `FetchPatientReport`.
message FetchPatientReportResponse {
  Patient patient = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `SchedulePatientReport`.
message SchedulePatientReportRequest {
  // What the operation needs besides the record.
  message Details {
    string format = 1;
    acme.common.v1.TimeWindow period = 2;
    repeated string recipient_emails = 3;
    string cron = 4;
    map<string, string> filters = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  SchedulePatientReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SchedulePatientReport`.
message SchedulePatientReportResponse {
  string report_id = 1;
  string download_uri = 2;
  map<string, string> summary = 3;
  acme.common.v1.TimeWindow period = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `StreamPatientMetrics`.
message StreamPatientMetricsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  StreamPatientMetricsRequest.Filter filter = 2;
  google.protobuf.Timestamp since = 3;
  int32 max_events = 4;
  acme.common.v1.ContactInfo subscriber = 5;
}

// The response of `StreamPatientMetrics`.
message StreamPatientMetricsResponse {
  Patient patient = 1;
  string change_type = 2;
  google.protobuf.Timestamp changed_at = 3;
  int64 sequence = 4;
  acme.common.v1.OperationResult result = 5;
}

// The request of `ListPatientReports`.
message ListPatientReportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListPatientReportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListPatientReports`.
message ListPatientReportsResponse {
  repeated Patient patients = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `SharePatientReport`.
message SharePatientReportRequest {
  // What the operation needs besides the record.
  message Details {
    acme.common.v1.ContactInfo recipient = 1;
    string template_id = 2;
    map<string, string> variables = 3;
    google.protobuf.Any payload = 4;
    string channel = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  SharePatientReportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `SharePatientReport`.
message SharePatientReportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  SharePatientReportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `CountPatientTotals`.
message CountPatientTotalsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated PatientStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  CountPatientTotalsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `CountPatientTotals`.
message CountPatientTotalsResponse {
  int64 count = 1;
  map<string, int64> by_status = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `DeletePatientReport`.
message DeletePatientReportRequest {
  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  string reason = 3;
  string etag = 4;
  bool force = 5;
}

// The response of `DeletePatientReport`.
message DeletePatientReportResponse {
  acme.common.v1.OperationResult result = 1;
  google.protobuf.Timestamp effective_at = 2;
}
