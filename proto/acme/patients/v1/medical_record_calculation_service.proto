syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "MedicalRecordCalculationServiceProto";
option java_package = "com.acme.patients.v1";

// Computes the figures of a medical record, such as totals, taxes, and estimates.
service MedicalRecordCalculationService {
  // Calculates a medical record.
  rpc CalculateMedicalRecord(CalculateMedicalRecordRequest) returns (CalculateMedicalRecordResponse);

  // Estimates a medical record.
  rpc EstimateMedicalRecord(EstimateMedicalRecordRequest) returns (EstimateMedicalRecordResponse);

  // Quotes a medical record.
  rpc QuoteMedicalRecord(QuoteMedicalRecordRequest) returns (QuoteMedicalRecordResponse);

  // Compares a medical record.
  rpc CompareMedicalRecordOptions(CompareMedicalRecordOptionsRequest) returns (CompareMedicalRecordOptionsResponse);

  // Simulates a medical record.
  rpc SimulateMedicalRecord(SimulateMedicalRecordRequest) returns (SimulateMedicalRecordResponse);

  // Explains a medical record.
  rpc ExplainMedicalRecordCalculation(ExplainMedicalRecordCalculationRequest) returns (ExplainMedicalRecordCalculationResponse);

  // Returns a medical record.
  rpc GetMedicalRecordRates(GetMedicalRecordRatesRequest) returns (GetMedicalRecordRatesResponse);
}

// The request of `CalculateMedicalRecord`.
message CalculateMedicalRecordRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string medical_record_id = 2;
  MedicalRecord medical_record = 3;
  CalculateMedicalRecordRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateMedicalRecord`.
message CalculateMedicalRecordResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateMedicalRecordResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  MedicalRecord medical_record = 1;
  CalculateMedicalRecordResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

