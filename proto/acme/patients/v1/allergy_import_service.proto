syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "AllergyImportServiceProto";
option java_package = "com.acme.patients.v1";

// Takes allergies in bulk from partners and legacy systems.
service AllergyImportService {
  // Takes a stream of allergies and answers once at the end.
  rpc ImportAllergies(stream ImportAllergiesRequest) returns (ImportAllergiesResponse);

  // Returns an allergy.
  rpc GetAllergyImportStatus(GetAllergyImportStatusRequest) returns (GetAllergyImportStatusResponse);

  // Cancels an allergy.
  rpc CancelAllergyImport(CancelAllergyImportRequest) returns (CancelAllergyImportResponse);

  // Validates an allergy.
  rpc ValidateAllergyImport(ValidateAllergyImportRequest) returns (ValidateAllergyImportResponse);

  // Lists allergies a page at a time.
  rpc ListAllergyImports(ListAllergyImportsRequest) returns (ListAllergyImportsResponse);

  // Retrys an allergy.
  rpc RetryAllergyImport(RetryAllergyImportRequest) returns (RetryAllergyImportResponse);

  // Maps an allergy.
  rpc MapAllergyImportColumns(MapAllergyImportColumnsRequest) returns (MapAllergyImportColumnsResponse);
}

// The request of `ImportAllergies`.
message ImportAllergiesRequest {
  // What a stream of records starts with.
  message StreamHeader {
    string source = 1;
    string format = 2;
    int64 total_records = 3;
    acme.common.v1.ContactInfo submitted_by = 4;
  }

  acme.common.v1.RequestContext context = 1;
  oneof chunk {
    ImportAllergiesRequest.StreamHeader header = 2;
    Allergy record = 3;
  }
  int64 sequence = 4;
}

// The response of `ImportAllergies`.
message ImportAllergiesResponse {
  // A record the import turned down.
  message Rejection {
    int64 sequence = 1;
    string reason = 2;
    string allergy_id = 3;
  }

  int64 accepted = 1;
  int64 rejected = 2;
  repeated ImportAllergiesResponse.Rejection rejections = 3;
  acme.common.v1.OperationResult result = 4;
}

// The request of `GetAllergyImportStatus`.
message GetAllergyImportStatusRequest {
  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  google.protobuf.FieldMask read_mask = 3;
}

// The response of `GetAllergyImportStatus`.
message GetAllergyImportStatusResponse {
  Allergy allergy = 1;
  acme.common.v1.OperationResult result = 2;
}

// The request of `CancelAllergyImport`.
message CancelAllergyImportRequest {
  // What the operation needs besides the record.
  message Details {
    string reason_code = 1;
    google.protobuf.Timestamp effective_at = 2;
    acme.identity.v1.UserRef new_owner = 3;
    acme.common.v1.ContactInfo notify_contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  CancelAllergyImportRequest.Details details = 3;
  string reason = 4;
  map<string, string> annotations = 5;
}

// The response of `CancelAllergyImport`.
message CancelAllergyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  CancelAllergyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ValidateAllergyImport`.
message ValidateAllergyImportRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  ValidateAllergyImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidateAllergyImport`.
message ValidateAllergyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  ValidateAllergyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `ListAllergyImports`.
message ListAllergyImportsRequest {
  // Which records to include.
  message Filter {
    string query = 1;
    repeated AllergyStatus statuses = 2;
    google.protobuf.Timestamp created_after = 3;
    map<string, string> labels = 4;
    string owner_id = 5;
    string region = 6;
  }

  acme.common.v1.RequestContext context = 1;
  acme.common.v1.PageRequest page = 2;
  ListAllergyImportsRequest.Filter filter = 3;
  string order_by = 4;
}

// The response of `ListAllergyImports`.
message ListAllergyImportsResponse {
  repeated Allergy allergies = 1;
  acme.common.v1.PageInfo page_info = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `RetryAllergyImport`.
message RetryAllergyImportRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  RetryAllergyImportRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `RetryAllergyImport`.
message RetryAllergyImportResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  RetryAllergyImportResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

// The request of `MapAllergyImportColumns`.
message MapAllergyImportColumnsRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  MapAllergyImportColumnsRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `MapAllergyImportColumns`.
message MapAllergyImportColumnsResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  MapAllergyImportColumnsResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}
