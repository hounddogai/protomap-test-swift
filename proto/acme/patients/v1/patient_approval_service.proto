syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/identity/v1/refs.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientApprovalServiceProto";
option java_package = "com.acme.patients.v1";

// Routes patients through approval, with escalation and delegation.
service PatientApprovalService {
  // Submits a patient.
  rpc SubmitPatient(SubmitPatientRequest) returns (SubmitPatientResponse);

  // Approves a patient.
  rpc ApprovePatient(ApprovePatientRequest) returns (ApprovePatientResponse);

  // Rejects a patient.
  rpc RejectPatient(RejectPatientRequest) returns (RejectPatientResponse);

  // Escalates a patient.
  rpc EscalatePatient(EscalatePatientRequest) returns (EscalatePatientResponse);

  // Lists patients a page at a time.
  rpc ListPendingPatients(ListPendingPatientsRequest) returns (ListPendingPatientsResponse);

  // Delegates a patient.
  rpc DelegatePatientApproval(DelegatePatientApprovalRequest) returns (DelegatePatientApprovalResponse);

  // Recalls a patient.
  rpc RecallPatient(RecallPatientRequest) returns (RecallPatientResponse);

  // Returns a patient.
  rpc GetPatientApprovalStatus(GetPatientApprovalStatusRequest) returns (GetPatientApprovalStatusResponse);
}

// The request of `SubmitPatient`.
message SubmitPatientRequest {
  // What the operation needs besides the record.
  message Details {
    string approver_email = 1;
    string comment = 2;
    repeated string conditions = 3;
    google.protobuf.Timestamp effective_at = 4;
    acme.identity.v1.UserRef approver = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  SubmitPatientRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `SubmitPatient`.
message SubmitPatientResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  SubmitPatientResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

