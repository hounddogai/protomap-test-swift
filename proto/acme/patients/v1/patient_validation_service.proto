syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "PatientValidationServiceProto";
option java_package = "com.acme.patients.v1";

// Checks patients against the rules before anything acts on them.
service PatientValidationService {
  // Validates a patient.
  rpc ValidatePatient(ValidatePatientRequest) returns (ValidatePatientResponse);

  // Previews a patient.
  rpc PreviewPatient(PreviewPatientRequest) returns (PreviewPatientResponse);

  // Checks a patient.
  rpc CheckPatientEligibility(CheckPatientEligibilityRequest) returns (CheckPatientEligibilityResponse);

  // Normalizes a patient.
  rpc NormalizePatient(NormalizePatientRequest) returns (NormalizePatientResponse);

  // Explains a patient.
  rpc ExplainPatientDecision(ExplainPatientDecisionRequest) returns (ExplainPatientDecisionResponse);

  // Scores a patient.
  rpc ScorePatient(ScorePatientRequest) returns (ScorePatientResponse);

  // Lints a patient.
  rpc LintPatients(LintPatientsRequest) returns (LintPatientsResponse);

  // Returns a patient.
  rpc GetPatientRules(GetPatientRulesRequest) returns (GetPatientRulesResponse);
}

// The request of `ValidatePatient`.
message ValidatePatientRequest {
  // What the operation needs besides the record.
  message Details {
    repeated string rules = 1;
    bool strict = 2;
    string locale = 3;
    acme.common.v1.ContactInfo contact = 4;
  }

  acme.common.v1.RequestContext context = 1;
  string patient_id = 2;
  Patient patient = 3;
  ValidatePatientRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `ValidatePatient`.
message ValidatePatientResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Patient patient = 1;
  ValidatePatientResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

