syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/contact.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/operation.proto";
import "acme/common/v1/paging.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "AllergyWorkflowServiceProto";
option java_package = "com.acme.patients.v1";

// Runs the long-lived workflow that takes an allergy from start to finish.
service AllergyWorkflowService {
  // Starts an allergy.
  rpc StartAllergyWorkflow(StartAllergyWorkflowRequest) returns (StartAllergyWorkflowResponse);

  // Advances an allergy.
  rpc AdvanceAllergyWorkflow(AdvanceAllergyWorkflowRequest) returns (AdvanceAllergyWorkflowResponse);

  // Cancels an allergy.
  rpc CancelAllergyWorkflow(CancelAllergyWorkflowRequest) returns (CancelAllergyWorkflowResponse);

  // Retrys an allergy.
  rpc RetryAllergyWorkflow(RetryAllergyWorkflowRequest) returns (RetryAllergyWorkflowResponse);

  // Pauses an allergy.
  rpc PauseAllergyWorkflow(PauseAllergyWorkflowRequest) returns (PauseAllergyWorkflowResponse);

  // Resumes an allergy.
  rpc ResumeAllergyWorkflow(ResumeAllergyWorkflowRequest) returns (ResumeAllergyWorkflowResponse);

  // Returns an allergy.
  rpc InspectAllergyWorkflow(InspectAllergyWorkflowRequest) returns (InspectAllergyWorkflowResponse);

  // Lists allergies a page at a time.
  rpc ListAllergyWorkflows(ListAllergyWorkflowsRequest) returns (ListAllergyWorkflowsResponse);

  // Signals an allergy.
  rpc SignalAllergyWorkflow(SignalAllergyWorkflowRequest) returns (SignalAllergyWorkflowResponse);
}

// The request of `StartAllergyWorkflow`.
message StartAllergyWorkflowRequest {
  // What the operation needs besides the record.
  message Details {
    string step = 1;
    map<string, string> parameters = 2;
    google.protobuf.Duration timeout = 3;
    string initiated_by = 4;
    acme.common.v1.ContactInfo notify = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  StartAllergyWorkflowRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `StartAllergyWorkflow`.
message StartAllergyWorkflowResponse {
  // What the operation decided.
  message Outcome {
    string status = 1;
    string message = 2;
    string reference_id = 3;
    repeated string next_steps = 4;
    google.protobuf.Timestamp effective_at = 5;
  }

  Allergy allergy = 1;
  StartAllergyWorkflowResponse.Outcome outcome = 2;
  acme.common.v1.OperationResult result = 3;
}

