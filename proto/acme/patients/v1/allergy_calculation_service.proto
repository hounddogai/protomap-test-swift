syntax = "proto3";

package acme.patients.v1;

import "acme/common/v1/address.proto";
import "acme/common/v1/context.proto";
import "acme/common/v1/money.proto";
import "acme/common/v1/operation.proto";
import "acme/patients/v1/patients.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Acme.Patients.V1";
option go_package = "github.com/hounddogai/protomap-test-golang/gen/acme/patients/v1;patientsv1";
option java_multiple_files = true;
option java_outer_classname = "AllergyCalculationServiceProto";
option java_package = "com.acme.patients.v1";

// Computes the figures of an allergy, such as totals, taxes, and estimates.
service AllergyCalculationService {
  // Calculates an allergy.
  rpc CalculateAllergy(CalculateAllergyRequest) returns (CalculateAllergyResponse);

  // Estimates an allergy.
  rpc EstimateAllergy(EstimateAllergyRequest) returns (EstimateAllergyResponse);

  // Quotes an allergy.
  rpc QuoteAllergy(QuoteAllergyRequest) returns (QuoteAllergyResponse);

  // Compares an allergy.
  rpc CompareAllergyOptions(CompareAllergyOptionsRequest) returns (CompareAllergyOptionsResponse);

  // Recalculates an allergy.
  rpc RecalculateAllergies(RecalculateAllergiesRequest) returns (RecalculateAllergiesResponse);

  // Simulates an allergy.
  rpc SimulateAllergy(SimulateAllergyRequest) returns (SimulateAllergyResponse);

  // Returns an allergy.
  rpc GetAllergyRates(GetAllergyRatesRequest) returns (GetAllergyRatesResponse);
}

// The request of `CalculateAllergy`.
message CalculateAllergyRequest {
  // What the operation needs besides the record.
  message Details {
    string currency_code = 1;
    acme.common.v1.PostalAddress destination = 2;
    repeated string scenario_ids = 3;
    bool include_breakdown = 4;
    acme.common.v1.Money budget = 5;
  }

  acme.common.v1.RequestContext context = 1;
  string allergy_id = 2;
  Allergy allergy = 3;
  CalculateAllergyRequest.Details details = 4;
  string reason = 5;
  map<string, string> annotations = 6;
}

// The response of `CalculateAllergy`.
message CalculateAllergyResponse {
  // How a figure was reached.
  message Breakdown {
    // One line of a breakdown.
    message Line {
      string label = 1;
      acme.common.v1.Money amount = 2;
      double rate = 3;
    }

    acme.common.v1.Money total = 1;
    repeated CalculateAllergyResponse.Breakdown.Line lines = 2;
    string currency_code = 3;
  }

  Allergy allergy = 1;
  CalculateAllergyResponse.Breakdown breakdown = 2;
  acme.common.v1.OperationResult result = 3;
}

